name: Apply Independent Photo Route
on:
  push:
    branches: [feature/independent-photo-to-reports]
    paths: [.github/workflows/apply-independent-photo-route.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-photo-to-reports
          fetch-depth: 0
      - name: Add independent personal photo route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text(encoding='utf-8')
          insert_before='''    async function fastForwardPersonalReportPhotos(message, read, persistence, modify, logger, http, config) {'''
          fn='''    async function independentPersonalPhotoToReports(message, read, modify, logger, http, config) {\n      if (!message || !isPersonalTarsRoom(message.room)) return false;\n      const intent = directFileIntent(message);\n      if (intent === "receipt" || intent === "mailing") return false;\n      const imageFiles = messageImageFiles(message);\n      if (!imageFiles.length) return false;\n      const room = await findOtchetRoom(read);\n      const appUser = await read.getUserReader().getByUsername("tars") || await read.getUserReader().getAppUser();\n      if (!room || !appUser) {\n        if (logger) logger.warn("INDEPENDENT_PHOTO_BLOCKED reports room or app user not found");\n        return false;\n      }\n      for (const sourceFile of imageFiles) {\n        const uploadId = String(sourceFile && (sourceFile._id || sourceFile.id) || "");\n        if (!uploadId) continue;\n        try {\n          const content = await read.getUploadReader().getBufferById(uploadId);\n          const kind = await personalImageKindForPreUpload(sourceFile, content, http, config, logger);\n          if (kind === "receipt" || kind === "mailing") {\n            if (logger) logger.info(`INDEPENDENT_PHOTO_BLOCKED kind=${kind} upload=${uploadId}`);\n            continue;\n          }\n          const sourceUpload = await read.getUploadReader().getById(uploadId);\n          const reportMessageId = await forwardReportPhotoMessage(message, sourceFile, sourceUpload, room, appUser, modify, logger, {\n            user: message.sender,\n            sourceMessageId: message.id,\n            read,\n            content,\n            http,\n            config\n          });\n          if (reportMessageId) {\n            if (logger) logger.info(`INDEPENDENT_PHOTO_OK upload=${uploadId} message=${reportMessageId}`);\n            return true;\n          }\n        } catch (error) {\n          if (logger) logger.warn(`INDEPENDENT_PHOTO_FAILED upload=${uploadId}: ${error && error.message || error}`);\n        }\n      }\n      return false;\n    }\n'''
          if insert_before not in s: raise SystemExit('fast forward anchor not found')
          s=s.replace(insert_before,fn+insert_before,1)
          export_anchor='''      fastForwardPersonalReportPhotos,\n      publishPendingReportPhotos,'''
          if export_anchor not in s: raise SystemExit('export anchor not found')
          s=s.replace(export_anchor,'''      independentPersonalPhotoToReports,\n      fastForwardPersonalReportPhotos,\n      publishPendingReportPhotos,''',1)
          call_anchor='''        const i = await this.receiptOcrConfig(n);\n        if (await this.handleMonthlyScheduleMessage(e, n, s, r)) return;'''
          call='''        const i = await this.receiptOcrConfig(n);\n        if (G.isPersonalTarsRoom(e && e.room) && G.directFileIntent(e) !== "receipt" && G.directFileIntent(e) !== "mailing") {\n          if (await G.independentPersonalPhotoToReports(e, n, r, this.getLogger(), t, i)) {\n            await this.refreshPreliminaryReportAnalysis(n, s, r, e.sender, e.room);\n            return;\n          }\n        }\n        if (await this.handleMonthlyScheduleMessage(e, n, s, r)) return;'''
          if call_anchor not in s: raise SystemExit('post-message call anchor not found')
          s=s.replace(call_anchor,call,1)
          p.write_text(s,encoding='utf-8')
          Path('tests/independent-photo-to-reports.test.js').write_text('''const fs=require("fs"),assert=require("assert"); const s=fs.readFileSync("TarsReportApp.js","utf8"); assert(s.includes("async function independentPersonalPhotoToReports")); assert(s.includes("INDEPENDENT_PHOTO_OK")); const a=s.indexOf("async executePostMessageSent"); const b=s.indexOf("async receiptOcrConfig",a); const x=s.slice(a,b); const independent=x.indexOf("independentPersonalPhotoToReports"); const claim=x.indexOf("claimPostMessage"); assert(independent>=0,"independent route is called"); assert(claim<0 || independent<claim,"independent route runs before financial claim"); assert(x.includes('directFileIntent(e) !== "receipt"')); assert(x.includes('directFileIntent(e) !== "mailing"')); console.log("PASS: independent photo route precedes legacy/financial routing and preserves receipt/mailing guards");\n''',encoding='utf-8')
          PY
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit independent route
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/independent-photo-to-reports.test.js
          git commit -m 'feat: add independent photo-to-reports route'
          git rm .github/workflows/apply-independent-photo-route.yml
          git commit -m 'ci: remove one-shot independent photo workflow'
          git push origin HEAD:feature/independent-photo-to-reports
