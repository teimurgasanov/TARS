name: Apply live receipt summary and reminder fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-live-receipt-summary-reminder-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-receipt-summary-reminder-dedupe
          fetch-depth: 0
      - name: Apply narrow fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TarsReportApp.js')
          s = path.read_text(encoding='utf-8')
          helper_anchor = '    async function rejectDuplicateMessage(message, read, persistence, modify, logger, http, ocrConfig) {'
          helper = '    function preUploadEntryMatchesPostedContent(entry, exact, message, now = Date.now()) {\n      if (!entry || entry.source !== "pre") return false;\n      const postedExact = String(exact || "");\n      if (!postedExact || String(entry.exact || "") !== postedExact) return false;\n      const userId = String(message && message.sender && message.sender.id || "");\n      const roomId = String(message && message.room && message.room.id || "");\n      if (!userId || !roomId) return false;\n      if (String(entry.userId || "") !== userId || String(entry.roomId || "") !== roomId) return false;\n      const uploadedAt = Number(entry.uploadedAt || 0);\n      const ttlMs = 30 * 60 * 1e3;\n      return uploadedAt > 0 && uploadedAt >= now - ttlMs && uploadedAt <= now + 60 * 1e3;\n    }\n'
          if 'function preUploadEntryMatchesPostedContent' not in s:
              if s.count(helper_anchor) != 1:
                  raise SystemExit(f'helper anchor count={s.count(helper_anchor)}')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          route_anchor = '          if (personalRoom && await rememberOrDeletePostedPersonalImageDuplicate(message, messageFile, content, read, persistence, modify, logger)) return true;\n          let preclassifiedRoom;'
          route_repl = '          if (personalRoom && await rememberOrDeletePostedPersonalImageDuplicate(message, messageFile, content, read, persistence, modify, logger)) return true;\n          const postedExact = exactHash(content);\n          let preclassifiedRoom;'
          if 'const postedExact = exactHash(content);' not in s:
              if s.count(route_anchor) != 1:
                  raise SystemExit(f'route anchor count={s.count(route_anchor)}')
              s = s.replace(route_anchor, route_repl, 1)
          old_find = 'const preEntry = candidateIndex && candidateIndex.photos.find((entry) => preUploadEntryMatchesMessage(entry, messageFileId, message));'
          new_find = 'const preEntry = candidateIndex && candidateIndex.photos.find((entry) => preUploadEntryMatchesMessage(entry, messageFileId, message) || preUploadEntryMatchesPostedContent(entry, postedExact, message));'
          if old_find in s:
              if s.count(old_find) != 1:
                  raise SystemExit(f'pre-entry anchor count={s.count(old_find)}')
              s = s.replace(old_find, new_find, 1)
          elif new_find not in s:
              raise SystemExit('pre-entry routing anchor missing')
          reminder_anchor = '        await t.getCreator().finish(N);\n        h.push({ userId: x.masterUserId, username: x.username || A.username || "", roomId: x.roomId, workday: c, slot: o, createdAt: a });'
          reminder_repl = '        await t.getCreator().finish(N);\n        u[v] = true;\n        h.push({ userId: x.masterUserId, username: x.username || A.username || "", roomId: x.roomId, workday: c, slot: o, createdAt: a });'
          if reminder_anchor in s:
              if s.count(reminder_anchor) != 1:
                  raise SystemExit(f'reminder anchor count={s.count(reminder_anchor)}')
              s = s.replace(reminder_anchor, reminder_repl, 1)
          elif 'await t.getCreator().finish(N);\n        u[v] = true;' not in s:
              raise SystemExit('reminder anchor missing')
          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          node tests/preindex-content-reuse.test.js
          node tests/scheduled-reminder-dedupe.test.js
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done
      - name: Commit fix only after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tars-ci'
          git config user.email 'tars-ci@users.noreply.github.com'
          git add TarsReportApp.js
          git diff --cached --check
          git commit -m 'fix: preserve accepted receipt routing and dedupe reminders'
          git push origin HEAD:fix/live-receipt-summary-reminder-dedupe
