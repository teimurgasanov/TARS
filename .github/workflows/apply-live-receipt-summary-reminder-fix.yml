name: Apply live receipt summary and reminder fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-live-receipt-summary-reminder-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-receipt-summary-reminder-dedupe
          fetch-depth: 0
      - name: Apply narrow fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TarsReportApp.js')
          s = path.read_text(encoding='utf-8')

          old_helper = '''    function preUploadEntryMatchesMessage(entry, messageFileId, message, now = Date.now()) {
      if (!entry || entry.source !== "pre") return false;
      const uploadId = String(messageFileId || "");
      if (!uploadId) return false;
      const uploadMatches = String(entry.uploadAttemptKey || "") === uploadId || String(entry.uploadId || "") === uploadId;
      if (!uploadMatches) return false;
      const userId = String(message && message.sender && message.sender.id || "");
      const roomId = String(message && message.room && message.room.id || "");
      if (!userId || !roomId) return false;
      if (String(entry.userId || "") !== userId || String(entry.roomId || "") !== roomId) return false;
      const uploadedAt = Number(entry.uploadedAt || 0);
      const ttlMs = 30 * 60 * 1e3;
      return uploadedAt > 0 && uploadedAt >= now - ttlMs && uploadedAt <= now + 60 * 1e3;
    }
'''
          new_helper = old_helper + '''    function preUploadEntryMatchesPostedContent(entry, exact, message, now = Date.now()) {
      if (!entry || entry.source !== "pre") return false;
      const postedExact = String(exact || "");
      if (!postedExact || String(entry.exact || "") !== postedExact) return false;
      const userId = String(message && message.sender && message.sender.id || "");
      const roomId = String(message && message.room && message.room.id || "");
      if (!userId || !roomId) return false;
      if (String(entry.userId || "") !== userId || String(entry.roomId || "") !== roomId) return false;
      const uploadedAt = Number(entry.uploadedAt || 0);
      const ttlMs = 30 * 60 * 1e3;
      return uploadedAt > 0 && uploadedAt >= now - ttlMs && uploadedAt <= now + 60 * 1e3;
    }
'''
          if s.count(old_helper) != 1:
              raise SystemExit(f'helper anchor count={s.count(old_helper)}')
          s = s.replace(old_helper, new_helper, 1)

          old_route = '''          const content = await read.getUploadReader().getBufferById(messageFileId);
          if (personalRoom && await rememberOrDeletePostedPersonalImageDuplicate(message, messageFile, content, read, persistence, modify, logger)) return true;
          let preclassifiedRoom;
          if (personalRoom && intent !== "mailing") {
            for (const candidateRoom of [PROTECTED_ROOMS.kassa, PROTECTED_ROOMS.otchet]) {
              const candidateIndex = await getScopedIndex(candidateRoom);
              const preEntry = candidateIndex && candidateIndex.photos.find((entry) => preUploadEntryMatchesMessage(entry, messageFileId, message));
              if (preEntry) {
'''
          new_route = '''          const content = await read.getUploadReader().getBufferById(messageFileId);
          if (personalRoom && await rememberOrDeletePostedPersonalImageDuplicate(message, messageFile, content, read, persistence, modify, logger)) return true;
          const postedExact = exactHash(content);
          let preclassifiedRoom;
          if (personalRoom && intent !== "mailing") {
            for (const candidateRoom of [PROTECTED_ROOMS.kassa, PROTECTED_ROOMS.otchet]) {
              const candidateIndex = await getScopedIndex(candidateRoom);
              const preEntry = candidateIndex && candidateIndex.photos.find((entry) => preUploadEntryMatchesMessage(entry, messageFileId, message) || preUploadEntryMatchesPostedContent(entry, postedExact, message));
              if (preEntry) {
'''
          if s.count(old_route) != 1:
              raise SystemExit(f'route anchor count={s.count(old_route)}')
          s = s.replace(old_route, new_route, 1)

          old_exact = '''          const exact = exactHash(content);
          const visual = visualHash(messageFile, content);
'''
          new_exact = '''          const exact = postedExact;
          const visual = visualHash(messageFile, content);
'''
          route_pos = s.find('protectedRoom = preclassifiedRoom || await protectedRoomForPersonalFile')
          exact_pos = s.find(old_exact, route_pos)
          if exact_pos < 0:
              raise SystemExit('post exact anchor missing')
          s = s[:exact_pos] + s[exact_pos:].replace(old_exact, new_exact, 1)

          old_reminder = '''        const N = t.getCreator().startMessage().setSender(f).setRoom(C).setText(M);
        await t.getCreator().finish(N);
        h.push({ userId: x.masterUserId, username: x.username || A.username || "", roomId: x.roomId, workday: c, slot: o, createdAt: a });
'''
          new_reminder = '''        const N = t.getCreator().startMessage().setSender(f).setRoom(C).setText(M);
        await t.getCreator().finish(N);
        u[v] = true;
        h.push({ userId: x.masterUserId, username: x.username || A.username || "", roomId: x.roomId, workday: c, slot: o, createdAt: a });
'''
          if s.count(old_reminder) != 1:
              raise SystemExit(f'reminder anchor count={s.count(old_reminder)}')
          s = s.replace(old_reminder, new_reminder, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          node tests/preindex-content-reuse.test.js
          node tests/scheduled-reminder-dedupe.test.js
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done
      - name: Commit fix only after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tars-ci'
          git config user.email 'tars-ci@users.noreply.github.com'
          git add TarsReportApp.js
          git diff --cached --check
          git commit -m 'fix: preserve accepted receipt routing and dedupe reminders'
          git push origin HEAD:fix/live-receipt-summary-reminder-dedupe
