name: Probe Rocket.Chat Apps API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Rocket.Chat auth and installed TARS app details
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
          TARS_APP_ID: 4c07ba1e-e87d-4d85-9e76-7d818d567439
        run: |
          set -euo pipefail
          test -n "$ROCKETCHAT_URL"
          test -n "$ROCKETCHAT_USER"
          test -n "$ROCKETCHAT_PASSWORD"
          test -n "$TARS_APP_ID"

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")

          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without authToken; probe blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without userId; probe blocked'; exit 1; }
          echo "Rocket.Chat login: OK"

          probe_get() {
            local route="$1"
            local out="$2"
            local code
            code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -H "X-User-Id: $USER_ID" \
              "$ROCKETCHAT_URL$route")
            echo "GET $route -> HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              return 0
            fi
            return 1
          }

          FOUND_ROUTE=''
          if probe_get "/api/v1/apps/$TARS_APP_ID" /tmp/tars-app.json; then
            FOUND_ROUTE="/api/v1/apps/$TARS_APP_ID"
          elif probe_get "/apps/$TARS_APP_ID" /tmp/tars-app.json; then
            FOUND_ROUTE="/apps/$TARS_APP_ID"
          else
            echo 'Installed-app GET route was not found. No write request was attempted.'
            exit 1
          fi

          echo "Installed app route: $FOUND_ROUTE"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tars-app.json'))
          app=d.get('app', d) if isinstance(d, dict) else {}
          if not isinstance(app, dict):
              raise SystemExit('Unexpected app response shape')
          safe={k:app.get(k) for k in ('id','name','nameSlug','version','status') if k in app}
          perms=app.get('permissionsGranted')
          if isinstance(perms, list):
              safe['permissionsGranted_count']=len(perms)
              safe['permissionsGranted']=[p.get('name') if isinstance(p,dict) else p for p in perms]
          elif perms is not None:
              safe['permissionsGranted_type']=type(perms).__name__
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          if app.get('id') != '4c07ba1e-e87d-4d85-9e76-7d818d567439':
              raise SystemExit('Returned app id does not match TARS app.json')
          PY

          echo 'Read-only installed-app probe complete. No POST request, ZIP upload, install, update, enable, disable, or delete action was sent.'
