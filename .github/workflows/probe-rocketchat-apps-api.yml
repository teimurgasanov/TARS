name: Probe Rocket.Chat Apps API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Rocket.Chat auth and private app routes
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROCKETCHAT_URL"
          test -n "$ROCKETCHAT_USER"
          test -n "$ROCKETCHAT_PASSWORD"

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")

          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without authToken; probe blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without userId; probe blocked'; exit 1; }
          echo "Rocket.Chat login: OK"

          probe_route() {
            local route="$1"
            local out
            out="/tmp/$(echo "$route" | tr '/.' '__').headers"
            local code
            code=$(curl --silent --show-error --output /dev/null --dump-header "$out" --write-out '%{http_code}' \
              -X OPTIONS \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -H "X-User-Id: $USER_ID" \
              -H 'Origin: https://github.com' \
              "$ROCKETCHAT_URL$route")
            echo "OPTIONS $route -> HTTP $code"
            grep -iE '^(allow|access-control-allow-methods|location):' "$out" || true
            if [ "$code" = "404" ]; then
              return 1
            fi
            return 0
          }

          echo 'Frontend source identified private-app routes /apps and /apps/update.'
          FOUND=0
          if probe_route '/apps'; then FOUND=1; fi
          if probe_route '/apps/update'; then FOUND=1; fi

          if [ "$FOUND" -ne 1 ]; then
            echo 'Neither frontend private-app route was visible to a safe OPTIONS probe.'
            exit 1
          fi

          echo 'Safe route probe complete. No POST request, ZIP upload, install, update, enable, disable, or delete action was sent.'
