name: Probe Rocket.Chat Apps API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Rocket.Chat auth and installed TARS app details
        if: ${{ false }}
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
          TARS_APP_ID: 4c07ba1e-e87d-4d85-9e76-7d818d567439
        run: |
          set -euo pipefail
          test -n "$ROCKETCHAT_URL"
          test -n "$ROCKETCHAT_USER"
          test -n "$ROCKETCHAT_PASSWORD"
          test -n "$TARS_APP_ID"

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")

          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without authToken; probe blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without userId; probe blocked'; exit 1; }
          echo "Rocket.Chat login: OK"

          probe_get() {
            local route="$1"
            local body="$2"
            local headers="$3"
            local code
            code=$(curl --silent --show-error \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -H "X-User-Id: $USER_ID" \
              "$ROCKETCHAT_URL$route")
            echo "GET $route -> HTTP $code"
            echo "Content-Type: $(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,""); sub(/^[^:]*:[ ]*/,""); print; exit}' "$headers")"
            echo "Content-Length: $(wc -c < "$body" | tr -d ' ') bytes"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              return 0
            fi
            return 1
          }

          FOUND_ROUTE=''
          if probe_get "/api/v1/apps/$TARS_APP_ID" /tmp/tars-app.body /tmp/tars-app.headers; then
            FOUND_ROUTE="/api/v1/apps/$TARS_APP_ID"
          elif probe_get "/apps/$TARS_APP_ID" /tmp/tars-app.body /tmp/tars-app.headers; then
            FOUND_ROUTE="/apps/$TARS_APP_ID"
          else
            echo 'Installed-app GET route was not found. No write request was attempted.'
            exit 1
          fi

          echo "Installed app route: $FOUND_ROUTE"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path('/tmp/tars-app.body')
          raw=p.read_bytes()
          if not raw:
              print('Response body is empty. Route exists, but this GET does not expose app metadata in the response body.')
              raise SystemExit(0)

          text=raw.decode('utf-8','replace')
          try:
              d=json.loads(text)
          except Exception:
              preview=text[:500].replace('\n',' ')
              print('Response body is non-JSON. Preview:', preview)
              raise SystemExit(0)

          app=d.get('app', d) if isinstance(d, dict) else {}
          if not isinstance(app, dict):
              print('Unexpected JSON response shape:', type(app).__name__)
              raise SystemExit(0)

          safe={k:app.get(k) for k in ('id','name','nameSlug','version','status') if k in app}
          perms=app.get('permissionsGranted')
          if isinstance(perms, list):
              safe['permissionsGranted_count']=len(perms)
              safe['permissionsGranted']=[p.get('name') if isinstance(p,dict) else p for p in perms]
          elif perms is not None:
              safe['permissionsGranted_type']=type(perms).__name__
          print(json.dumps(safe, ensure_ascii=False, indent=2))

          returned_id=app.get('id')
          if returned_id is not None and returned_id != '4c07ba1e-e87d-4d85-9e76-7d818d567439':
              raise SystemExit('Returned app id does not match TARS app.json')
          PY

          echo 'Read-only installed-app probe complete. No POST request, ZIP upload, install, update, enable, disable, or delete action was sent.'

      - name: Enable only Receipt Verification V2 shadow and verify
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
          TARS_APP_ID: 4c07ba1e-e87d-4d85-9e76-7d818d567439
          TARGET_SETTING_ID: receipt_verification_v2_shadow_enabled
        run: |
          set -euo pipefail
          AUTH_TOKEN=''
          USER_ID=''
          APP_BODY="$(mktemp "$RUNNER_TEMP/tars-app-settings.XXXXXX")"
          UPDATE_BODY="$(mktemp "$RUNNER_TEMP/tars-app-settings-update.XXXXXX")"
          PAYLOAD="$(mktemp "$RUNNER_TEMP/tars-app-settings-payload.XXXXXX")"

          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            if [ -n "$AUTH_TOKEN" ] && [ -n "$USER_ID" ]; then
              logout_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                -X POST -H "X-Auth-Token: $AUTH_TOKEN" -H "X-User-Id: $USER_ID" \
                "$ROCKETCHAT_URL/api/v1/logout")
              if [ "$logout_code" -ge 200 ] && [ "$logout_code" -lt 300 ]; then
                echo 'Rocket.Chat setting session logout: OK'
              else
                echo "Rocket.Chat setting session logout failed: HTTP $logout_code"
                [ "$original_status" -ne 0 ] || original_status=1
              fi
            fi
            AUTH_TOKEN=''
            USER_ID=''
            rm -f "$APP_BODY" "$UPDATE_BODY" "$PAYLOAD"
            exit "$original_status"
          }
          trap cleanup EXIT

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" "$ROCKETCHAT_URL/api/v1/login")
          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          LOGIN_JSON=''
          test -n "$AUTH_TOKEN"
          test -n "$USER_ID"
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$USER_ID"
          echo 'Rocket.Chat setting authentication: OK'

          GET_ROUTE="/api/apps/$TARS_APP_ID/settings"
          get_code=$(curl --silent --show-error --output "$APP_BODY" --write-out '%{http_code}' \
            -H "X-Auth-Token: $AUTH_TOKEN" -H "X-User-Id: $USER_ID" \
            "$ROCKETCHAT_URL$GET_ROUTE")
          test "$get_code" -ge 200
          test "$get_code" -lt 300

          APP_BODY="$APP_BODY" PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import json, os
          source=json.load(open(os.environ['APP_BODY'], encoding='utf-8'))
          app=source.get('app', source) if isinstance(source, dict) else {}
          settings=app.get('settings', source.get('settings') if isinstance(source, dict) else None)
          if isinstance(settings, dict):
              settings=list(settings.values())
          if not isinstance(settings, list):
              raise SystemExit('App settings were not returned; no update attempted')
          target=os.environ['TARGET_SETTING_ID']
          matches=[item for item in settings if isinstance(item, dict) and item.get('id') == target]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one target app setting, found {len(matches)}; no update attempted')
          before=matches[0].get('value', matches[0].get('packageValue'))
          if before not in (False, True, None):
              raise SystemExit('Target setting is not boolean; no update attempted')
          matches[0]['value']=True
          with open(os.environ['PAYLOAD'], 'w', encoding='utf-8') as out:
              json.dump({'settings': settings}, out, separators=(',', ':'))
          print('Target setting before:', str(bool(before)).lower())
          print('Prepared exactly one setting value change: false -> true' if before is not True else 'Target setting already true')
          PY

          post_setting() {
            local route="$1"
            curl --silent --show-error --output "$UPDATE_BODY" --write-out '%{http_code}' \
              -X POST -H "X-Auth-Token: $AUTH_TOKEN" -H "X-User-Id: $USER_ID" \
              -H 'Content-Type: application/json' --data-binary "@$PAYLOAD" \
              "$ROCKETCHAT_URL$route"
          }
          update_code=$(post_setting "/api/apps/$TARS_APP_ID/settings")
          echo "App settings update HTTP $update_code"
          test "$update_code" -ge 200
          test "$update_code" -lt 300

          verify_code=$(curl --silent --show-error --output "$APP_BODY" --write-out '%{http_code}' \
            -H "X-Auth-Token: $AUTH_TOKEN" -H "X-User-Id: $USER_ID" \
            "$ROCKETCHAT_URL$GET_ROUTE")
          test "$verify_code" -ge 200
          test "$verify_code" -lt 300
          APP_BODY="$APP_BODY" python3 - <<'PY'
          import json, os
          source=json.load(open(os.environ['APP_BODY'], encoding='utf-8'))
          app=source.get('app', source) if isinstance(source, dict) else {}
          settings=app.get('settings', source.get('settings') if isinstance(source, dict) else None)
          if isinstance(settings, dict): settings=list(settings.values())
          target=os.environ['TARGET_SETTING_ID']
          matches=[item for item in settings or [] if isinstance(item, dict) and item.get('id') == target]
          if len(matches) != 1 or matches[0].get('value') is not True:
              raise SystemExit('Target setting verification failed')
          print('receipt_verification_v2_shadow_enabled=true: VERIFIED')
          PY
