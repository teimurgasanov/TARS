name: Apply receipt date semantics fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-receipt-date-semantics-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Align all receipt-only date semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text()

          def replace_in_function(name, old, new, expected=1):
              global s
              start=s.find(f'function {name}')
              if start<0:
                  start=s.find(f'async function {name}')
              if start<0: raise SystemExit(f'{name} missing')
              next_async=s.find('\n    async function ', start+20)
              next_func=s.find('\n    function ', start+20)
              ends=[x for x in (next_async,next_func) if x>start]
              end=min(ends) if ends else len(s)
              block=s[start:end]
              count=block.count(old)
              if count!=expected: raise SystemExit(f'{name}: anchor mismatch for {old!r}: {count}')
              block=block.replace(old,new,expected)
              s=s[:start]+block+s[end:]

          replace_in_function('dateFromEntry',
              'return workdayForTimestamp(entry && entry.uploadedAt, config);',
              'return receiptCalendarDateForTimestamp(entry && entry.uploadedAt, config);')
          replace_in_function('confirmedTransferSummaryForUser',
              'const workday = targetDate || expectedWorkday(config);',
              'const workday = targetDate || expectedReceiptDate(config);')
          replace_in_function('publishMasterTransferSummary',
              'const targetDate = String(entry && entry.receiptDate || expectedWorkday(config));',
              'const targetDate = String(entry && entry.receiptDate || expectedReceiptDate(config));')
          replace_in_function('resolveTransferSummaryUser',
              'const targetDate = expectedWorkday(config || {});',
              'const targetDate = expectedReceiptDate(config || {});')
          replace_in_function('sendMasterTransferSummaryRequest',
              'const targetDate = expectedWorkday(config);',
              'const targetDate = expectedReceiptDate(config);')
          replace_in_function('sendTodayTransferSummary',
              'const targetDate = expectedWorkday(config);',
              'const targetDate = expectedReceiptDate(config);')

          # Receipt archive fallback is receipt data, not report workday data.
          old='receiptDate: entry.receiptDate || workdayForTimestamp(createdAt, config || {}),'
          if s.count(old)!=1: raise SystemExit(f'archive receiptDate anchor mismatch: {s.count(old)}')
          s=s.replace(old,'receiptDate: entry.receiptDate || receiptCalendarDateForTimestamp(createdAt, config || {}),',1)

          p.write_text(s)
          PY
          node --check TarsReportApp.js

      - name: Add cutoff behavioral regression test
        shell: bash
        run: |
          cat > tests/receipt-date-cutoff-behavior.test.js <<'EOF'
          const fs=require('fs'), assert=require('assert');
          const s=fs.readFileSync('TarsReportApp.js','utf8');

          function block(name){
            let start=s.indexOf(`function ${name}`);
            if(start<0) start=s.indexOf(`async function ${name}`);
            assert(start>=0, `${name} missing`);
            const a=s.indexOf('\n    async function ',start+20);
            const f=s.indexOf('\n    function ',start+20);
            const ends=[a,f].filter(x=>x>start);
            const end=ends.length?Math.min(...ends):s.length;
            return s.slice(start,end);
          }

          assert(block('dateFromEntry').includes('receiptCalendarDateForTimestamp(entry && entry.uploadedAt, config)'));
          assert(block('confirmedTransferSummaryForUser').includes('targetDate || expectedReceiptDate(config)'));
          assert(block('publishMasterTransferSummary').includes('expectedReceiptDate(config)'));
          assert(block('resolveTransferSummaryUser').includes('expectedReceiptDate(config || {})'));
          assert(block('sendMasterTransferSummaryRequest').includes('const targetDate = expectedReceiptDate(config);'));
          assert(block('repairTodayReceiptIndex').includes('const targetDate = expectedReceiptDate(config);'));
          assert(block('repairTodayReceiptIndex').includes('receiptCalendarDateForTimestamp(createdAt, config)'));
          assert(block('sendTodayTransferSummary').includes('const targetDate = expectedReceiptDate(config);'));
          assert(s.includes('receiptDate: entry.receiptDate || receiptCalendarDateForTimestamp(createdAt, config || {})'));

          // Workday semantics must remain present elsewhere for reports/cleanup.
          assert(s.includes('workdayForTimestamp('), 'report/cleanup workday helper unexpectedly removed');

          // Explicit cutoff boundary: local 00:30 on Aug 25 is receipt date Aug 25, while workday may still be Aug 24.
          const calStart=s.indexOf('function receiptCalendarDateForTimestamp');
          const calEnd=s.indexOf('function expectedReceiptDate',calStart);
          const wdStart=s.indexOf('function workdayForTimestamp');
          const wdEnd=s.indexOf('function expectedWorkday',wdStart);
          assert(calStart>=0&&calEnd>calStart&&wdStart>=0&&wdEnd>wdStart);
          eval(s.slice(wdStart,wdEnd));
          eval(s.slice(calStart,calEnd));
          const cfg={timeZone:'Europe/Astrakhan',cutoffHour:4};
          const ts=Date.parse('2026-08-24T20:30:00Z'); // 00:30 Aug 25 Astrakhan
          assert.strictEqual(receiptCalendarDateForTimestamp(ts,cfg),'2026-08-25');
          assert.strictEqual(workdayForTimestamp(ts,cfg),'2026-08-24');
          console.log('PASS: receipt accounting is calendar-day based across cutoff; report workday remains separate');
          EOF

      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do echo "==> $f"; node "$f"; done

      - name: Commit only after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TARS Automation'
          git config user.email 'tars-automation@users.noreply.github.com'
          git add TarsReportApp.js tests/receipt-date-cutoff-behavior.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify receipt calendar date semantics'
          git push origin HEAD:develop
