name: Scanner 2.0 Packaging CI

on:
  push:
    branches:
      - feature/scanner-2.0
      - feature/scanner2-shadow-sampling
      - fix/scanner2-shadow-config-scope
      - fix/personal-rejected-receipt-control-route
      - fix/receipt-date-early-mismatch
      - integration/date-mismatch-on-current-develop
      - perf/receipt-primary-reuse-status
      - diagnostics/work-photo-classification-v1
      - diagnostic/personal-image-source-mime-v2
      - feature/manual-image-type-selection
      - integration/manual-selection-current-develop
      - feature/vision-dominant-image-routing
      - integration/vision-dominant-current-develop
      - fix/vision-high-confidence-authority
      - integration/vision-high-authority-current-develop
      - fix/vision-maximum-authority
      - integration/vision-maximum-authority-current-develop
      - feature/personal-image-router-v3
      - fix/personal-image-selector-visible
      - fix/preselected-photo-financial-veto-only
      - fix/photo-button-vision-safety-only
      - feature/image-classification-v1-shadow
      - fix/receipt-openai-unavailable-fallback
      - fix/receipt-openai-runtime-fallback
      - feature/tars-maximum-vision
      - feature/yandex-ai-studio-vision-provider
      - integration/receipt-extraction-fixes-current-develop
      - fix/receipt-late-report-reconciliation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner2-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Verify deterministic package
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'feature/scanner-2.0' ||
      github.base_ref == 'feature/scanner-2.0' ||
      github.head_ref == 'feature/scanner2-shadow-sampling' ||
      github.base_ref == 'feature/scanner2-shadow-sampling' ||
      github.head_ref == 'fix/scanner2-shadow-config-scope' ||
      github.base_ref == 'fix/scanner2-shadow-config-scope' ||
      github.head_ref == 'fix/personal-rejected-receipt-control-route' ||
      github.base_ref == 'fix/personal-rejected-receipt-control-route' ||
      github.head_ref == 'fix/receipt-date-early-mismatch' ||
      github.base_ref == 'fix/receipt-date-early-mismatch' ||
      github.head_ref == 'integration/date-mismatch-on-current-develop' ||
      github.base_ref == 'integration/date-mismatch-on-current-develop'
      || github.head_ref == 'perf/receipt-primary-reuse-status'
      || github.base_ref == 'perf/receipt-primary-reuse-status'
      || github.head_ref == 'diagnostics/work-photo-classification-v1'
      || github.base_ref == 'diagnostics/work-photo-classification-v1'
      || github.head_ref == 'diagnostic/personal-image-source-mime-v2'
      || github.base_ref == 'diagnostic/personal-image-source-mime-v2'
      || github.head_ref == 'feature/manual-image-type-selection'
      || github.base_ref == 'feature/manual-image-type-selection'
      || github.head_ref == 'integration/manual-selection-current-develop'
      || github.base_ref == 'integration/manual-selection-current-develop'
      || github.head_ref == 'feature/vision-dominant-image-routing'
      || github.base_ref == 'feature/vision-dominant-image-routing'
      || github.head_ref == 'integration/vision-dominant-current-develop'
      || github.base_ref == 'integration/vision-dominant-current-develop'
      || github.head_ref == 'fix/vision-high-confidence-authority'
      || github.base_ref == 'fix/vision-high-confidence-authority'
      || github.head_ref == 'integration/vision-high-authority-current-develop'
      || github.base_ref == 'integration/vision-high-authority-current-develop'
      || github.head_ref == 'fix/vision-maximum-authority'
      || github.base_ref == 'fix/vision-maximum-authority'
      || github.head_ref == 'integration/vision-maximum-authority-current-develop'
      || github.base_ref == 'integration/vision-maximum-authority-current-develop'
      || github.head_ref == 'feature/personal-image-router-v3'
      || github.base_ref == 'feature/personal-image-router-v3'
      || github.head_ref == 'fix/personal-image-selector-visible'
      || github.base_ref == 'fix/personal-image-selector-visible'
      || github.head_ref == 'fix/preselected-photo-financial-veto-only'
      || github.base_ref == 'fix/preselected-photo-financial-veto-only'
      || github.head_ref == 'fix/photo-button-vision-safety-only'
      || github.base_ref == 'fix/photo-button-vision-safety-only'
      || github.head_ref == 'feature/image-classification-v1-shadow'
      || github.base_ref == 'feature/image-classification-v1-shadow'
      || github.head_ref == 'fix/receipt-openai-unavailable-fallback'
      || github.base_ref == 'fix/receipt-openai-unavailable-fallback'
      || github.head_ref == 'fix/receipt-openai-runtime-fallback'
      || github.base_ref == 'fix/receipt-openai-runtime-fallback'
      || github.head_ref == 'feature/tars-maximum-vision'
      || github.base_ref == 'feature/tars-maximum-vision'
      || github.head_ref == 'feature/yandex-ai-studio-vision-provider'
      || github.base_ref == 'feature/yandex-ai-studio-vision-provider'
      || github.head_ref == 'integration/receipt-extraction-fixes-current-develop'
      || github.base_ref == 'integration/receipt-extraction-fixes-current-develop'
      || github.head_ref == 'fix/receipt-late-report-reconciliation'
      || github.base_ref == 'fix/receipt-late-report-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install required shell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version

      - name: Capture protected source hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA_BEFORE=$(sha256sum TarsReportApp.js | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MANIFEST_SHA_BEFORE=$(sha256sum app.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Install pinned build dependency
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          NODE_VERSION="$(node --version)"
          ESBUILD_VERSION="$(node -p 'require("esbuild/package.json").version')"
          test "${NODE_VERSION%%.*}" = "v20"
          test "$ESBUILD_VERSION" = "0.12.29"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "ESBUILD_VERSION=$ESBUILD_VERSION" >> "$GITHUB_ENV"

      - name: Validate scripts and working tree
        shell: bash
        run: |
          set -euo pipefail
          zsh -n build-tars.sh
          node --check tools/tars-build-entry.js
          node --check tools/verify-tars-bundle.js
          node --check tests/scanner2-packaging.test.js
          node --check tests/image-classification-v1-runtime-shadow.test.js
          node --check tests/receipt-vision-engine-v1.test.js
          node --check tests/receipt-extraction-fixes-v1.test.js
          node --check tests/receipt-replay-v1.test.js
          git diff --check

      - name: Run Scanner 2.0 tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/scanner2-packaging.test.js
          scanner_count=1
          for test_file in tests/scanner2-*.test.js; do
            if [ "$test_file" = "tests/scanner2-packaging.test.js" ]; then
              continue
            fi
            echo "==> $test_file"
            node "$test_file"
            scanner_count=$((scanner_count + 1))
          done
          test "$scanner_count" -eq 22
          echo "SCANNER2_TEST_COUNT=$scanner_count" >> "$GITHUB_ENV"

      - name: Run ImageClassificationV1 tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/image-classification-v1.test.js
          node tests/image-classification-v1-runtime-shadow.test.js
          echo "IMAGE_CLASSIFICATION_V1_TEST_COUNT=2" >> "$GITHUB_ENV"

      - name: Run Yandex AI Studio provider tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/yandex-ai-studio-vision-provider.test.js

      - name: Run Receipt Vision Engine V1 tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/receipt-vision-engine-v1.test.js
          node tests/receipt-extraction-fixes-v1.test.js
          node tests/receipt-replay-v1.test.js
          echo "RECEIPT_VISION_ENGINE_V1_TEST_COUNT=3" >> "$GITHUB_ENV"

      - name: Run TARS Memory V1 golden gate
        shell: bash
        run: |
          set -euo pipefail
          node tests/tars-memory-v1.test.js

      - name: Run 82 legacy TARS tests
        shell: bash
        run: |
          set -euo pipefail
          legacy_count=0
          while IFS= read -r test_file; do
            echo "==> $test_file"
            node "$test_file"
            legacy_count=$((legacy_count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'scanner2-*.test.js' ! -name 'image-classification-v1.test.js' ! -name 'image-classification-v1-runtime-shadow.test.js' ! -name 'yandex-ai-studio-vision-provider.test.js' ! -name 'receipt-vision-engine-v1.test.js' ! -name 'receipt-extraction-fixes-v1.test.js' ! -name 'receipt-replay-v1.test.js' ! -name 'tars-memory-v1.test.js' | sort)
          test "$legacy_count" -eq 82
          echo "LEGACY_TEST_COUNT=$legacy_count" >> "$GITHUB_ENV"

      - name: Build canonical package
        shell: bash
        run: |
          set -euo pipefail
          ./build-tars.sh

      - name: Verify package and source integrity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./app.json").version')"
          ZIP_PATH="$PWD/tars-report_${VERSION}.zip"
          test -f "$ZIP_PATH"
          unzip -t "$ZIP_PATH"

          EXPECTED_CONTENTS="$(printf '%s\n' app.json TarsReportApp.js en.json ru.json icon.png)"
          ZIP_CONTENTS="$(unzip -Z1 "$ZIP_PATH")"
          test "$ZIP_CONTENTS" = "$EXPECTED_CONTENTS"

          BUNDLE_PATH="$RUNNER_TEMP/TarsReportApp.js"
          unzip -p "$ZIP_PATH" TarsReportApp.js > "$BUNDLE_PATH"
          node --check "$BUNDLE_PATH"
          node tools/verify-tars-bundle.js "$BUNDLE_PATH"

          if ! grep -Eq 'safeShadowRecord[[:space:]]*\(' TarsReportApp.js; then
            echo "Expected fail-open runtime Shadow Recorder call is missing" >&2
            exit 1
          fi
          if ! grep -Eq 'createShadowTokenizer[[:space:]]*\(' TarsReportApp.js; then
            echo "Expected runtime shadow tokenizer call is missing" >&2
            exit 1
          fi
          if grep -Eq '(evaluateRules|resolveConflicts|makeDecision|runOfflineComparison|runOfflineDataset)[[:space:]]*\(' TarsReportApp.js; then
            echo "Runtime Scanner 2.0 decision call detected" >&2
            exit 1
          fi

          test "$(sha256sum TarsReportApp.js | awk '{print $1}')" = "$SOURCE_SHA_BEFORE"
          test "$(sha256sum app.json | awk '{print $1}')" = "$MANIFEST_SHA_BEFORE"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "BUNDLE_SHA256=$(sha256sum "$BUNDLE_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          {
            echo "ZIP_CONTENTS<<EOF"
            printf '%s\n' "$ZIP_CONTENTS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Write verification summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Scanner 2.0 packaging verification"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Node.js | \`$NODE_VERSION\` |"
            echo "| esbuild | \`$ESBUILD_VERSION\` |"
            echo "| Bundled TarsReportApp.js SHA-256 | \`$BUNDLE_SHA256\` |"
            echo "| ZIP SHA-256 | \`$ZIP_SHA256\` |"
            echo "| Scanner 2.0 tests | $SCANNER2_TEST_COUNT |"
            echo "| ImageClassificationV1 tests | $IMAGE_CLASSIFICATION_V1_TEST_COUNT |"
            echo "| Legacy tests | $LEGACY_TEST_COUNT |"
            echo
            echo "ZIP SHA-256 is diagnostic only; ZIP timestamps are not the reproducibility contract."
            echo
            echo "### ZIP contents"
            echo '```text'
            printf '%s\n' "$ZIP_CONTENTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner2-package-${{ github.sha }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 2
