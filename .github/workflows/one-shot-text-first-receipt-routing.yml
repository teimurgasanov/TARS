name: One-shot text-first receipt routing fix

on:
  push:
    branches: ["fix/text-first-receipt-routing"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/text-first-receipt-routing
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/apply-text-first-receipt-routing.py
      - name: Syntax check
        run: node --check TarsReportApp.js
      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarsReportApp.js tests/openai-vision-receipt-routing.test.js
          git diff --cached --check
          git commit -m "fix: route ambiguous Vision images through strict receipt validation"
          git push origin HEAD:fix/text-first-receipt-routing
