name: Inspect Photo Forwarder
on:
  push:
    branches: [fix/photo-inside-existing-forwarder]
    paths: [.github/workflows/inspect-photo-forwarder.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/photo-inside-existing-forwarder
      - name: Print decision helper context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('TarsReportApp.js').read_text(encoding='utf-8')
          for needle in ['async function shouldForwardConfirmedWorkPhoto','function shouldForwardConfirmedWorkPhoto']:
              i=s.find(needle)
              if i>=0: break
          if i<0: raise SystemExit('decision helper not found')
          j=s.find('\n    async function ', i+len(needle))
          if j<0: j=s.find('\n    function ', i+len(needle))
          if j<0: j=min(len(s), i+12000)
          print(s[i:j])
          PY
