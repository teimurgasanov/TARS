name: Apply Photo Delivery Fallback
on:
  push:
    branches: [fix/photo-inside-existing-forwarder]
    paths: [.github/workflows/apply-photo-delivery-fallback.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/photo-inside-existing-forwarder
          fetch-depth: 0
      - name: Add fallback inside existing photo forwarder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text(encoding='utf-8')
          old='''        const reportMessageId = await forwardReportPhotoMessage(message, sourceFile, sourceUpload, room, appUser, modify, logger, {\n          user: message.sender,\n          sourceMessageId: message.id,\n          read,\n          content,\n          http,\n          config\n        });\n        if (!reportMessageId) throw new Error("Rocket.Chat did not create the fast forwarded report photo message");'''
          new='''        let reportMessageId = await forwardReportPhotoMessage(message, sourceFile, sourceUpload, room, appUser, modify, logger, {\n          user: message.sender,\n          sourceMessageId: message.id,\n          read,\n          content,\n          http,\n          config\n        });\n        if (!reportMessageId) {\n          // Independent delivery fallback, but still inside the existing guarded\n          // photo-forwarding path. Receipts/mailings never reach this point.\n          const fallbackFile = {\n            _id: uploadId,\n            name: String(sourceFile && (sourceFile.name || sourceFile.title) || sourceUpload && sourceUpload.name || "photo-report.jpg"),\n            type: String(sourceFile && (sourceFile.type || sourceFile.mimeType) || sourceUpload && sourceUpload.type || "image/jpeg")\n          };\n          const master = message.sender ? `@${message.sender.username || message.sender.name || message.sender.id}` : "мастер";\n          const fallbackBuilder = modify.getCreator().startMessage({\n            room,\n            sender: appUser,\n            text: `Мастер: ${master}`,\n            file: fallbackFile,\n            parseUrls: false\n          });\n          reportMessageId = await modify.getCreator().finish(fallbackBuilder);\n          if (reportMessageId && logger) logger.info(`FAST_PHOTO_FORWARD_FALLBACK_OK upload=${uploadId} message=${reportMessageId}`);\n        }\n        if (!reportMessageId) throw new Error("Rocket.Chat did not create the fast forwarded report photo message");'''
          if old not in s: raise SystemExit('forwardReportPhotoMessage block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('tests/photo-delivery-fallback.test.js').write_text('''const fs=require("fs"),assert=require("assert");\nconst s=fs.readFileSync("TarsReportApp.js","utf8");\nconst a=s.indexOf("async function fastForwardPersonalReportPhotos");\nconst b=s.indexOf("async function",a+50);\nconst x=s.slice(a,b>0?b:s.length);\nassert(x.includes('intent === "mailing" || intent === "receipt"'),"receipt/mailing guard preserved");\nassert(x.includes("shouldForwardConfirmedWorkPhoto"),"existing classification gate preserved");\nassert(x.includes("FAST_PHOTO_FORWARD_FALLBACK_OK"),"delivery fallback exists");\nassert(x.includes("modify.getCreator().startMessage"),"fallback uses existing Rocket.Chat creator");\nassert(x.indexOf("FAST_PHOTO_FORWARD_FALLBACK_OK") > x.indexOf("shouldForwardConfirmedWorkPhoto"),"fallback runs only after photo guard");\nconsole.log("PASS: guarded photo forwarder has direct Rocket.Chat delivery fallback");\n''',encoding='utf-8')
          PY
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/photo-delivery-fallback.test.js
          git commit -m 'fix: add guarded report photo delivery fallback'
          git push origin HEAD:fix/photo-inside-existing-forwarder
