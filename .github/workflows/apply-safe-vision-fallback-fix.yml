name: Apply Safe Vision Fallback Fix
on:
  push:
    branches: [fix/text-first-receipt-routing]
    paths:
      - .github/workflows/apply-safe-vision-fallback-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/text-first-receipt-routing
          fetch-depth: 0
      - name: Remove broad aiChecked fallback exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TarsReportApp.js')
          s = p.read_text()
          start = s.index('async function personalImageKindForPreUpload')
          end = s.index('async function personalImageIsReceiptForPreUpload', start)
          block = s[start:end]
          needle = '      if (aiChecked) return "receipt";\n'
          assert block.count(needle) == 1, f'expected one broad fallback, got {block.count(needle)}'
          block = block.replace(needle, '', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Verify syntax and all regression tests
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit runtime fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TarsReportApp.js
          git commit -m 'fix: remove broad ambiguous Vision receipt fallback'
          git push origin HEAD:fix/text-first-receipt-routing
