name: Apply Inline Photo Module
on:
  push:
    branches: [feature/photo-module-inline]
    paths: [.github/workflows/apply-inline-photo-module.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photo-module-inline
          fetch-depth: 0
      - name: Inline isolated photo route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text(encoding='utf-8')
          module=Path('IndependentPhotoRoute.js').read_text(encoding='utf-8')
          module=module.replace('"use strict";\n\n','',1)
          module=module.replace('\nmodule.exports = { routeIndependentPhoto };\n','\n')
          begin='// INDEPENDENT_PHOTO_ROUTE_BEGIN\n'
          end='// INDEPENDENT_PHOTO_ROUTE_END\n'
          if begin not in s:
              marker='"use strict";\n'
              if marker not in s: raise SystemExit('strict marker missing')
              s=s.replace(marker, marker+begin+module+end, 1)
          old='''    const appUser = await n.getUserReader().getByUsername("tars") || await n.getUserReader().getAppUser();\n    if (G.isTarsAppMessage(e, appUser)) return;'''
          new='''    const appUser = await n.getUserReader().getByUsername("tars") || await n.getUserReader().getAppUser();\n    if (G.isTarsAppMessage(e, appUser)) return;\n    try {\n      if (await routeIndependentPhoto(e, n, t, r, this.getLogger(), {\n        isPersonalRoom: G.isPersonalTarsRoom,\n        directFileIntent: G.directFileIntent,\n        isAppMessage: (message) => G.isTarsAppMessage(message, appUser)\n      })) {\n        await this.refreshPreliminaryReportAnalysis(n, s, r, e.sender, e.room);\n        return;\n      }\n    } catch (error) {\n      this.getLogger().warn(`INDEPENDENT_PHOTO_ROUTE_FAILED: ${error && error.message || error}`);\n    }'''
          if 'routeIndependentPhoto(e, n, t, r' not in s:
              if old not in s: raise SystemExit('post-message insertion marker missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('tests/independent-photo-inline.test.js').write_text('''const fs=require("fs"),assert=require("assert");\nconst s=fs.readFileSync("TarsReportApp.js","utf8");\nassert(s.includes("INDEPENDENT_PHOTO_ROUTE_BEGIN"));\nassert(s.includes("async function routeIndependentPhoto"));\nassert(s.includes('kind !== "photo"'));\nassert(s.includes('intent === "receipt" || intent === "mailing"'));\nassert(s.includes('routeIndependentPhoto(e, n, t, r'));\nassert(!s.includes('require("./IndependentPhotoRoute")'));\nconsole.log("PASS: independent photo route is inline and leaves deploy package unchanged");\n''',encoding='utf-8')
          PY
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/independent-photo-inline.test.js
          git commit -m 'feat: add isolated inline photo route'
          git push origin HEAD:feature/photo-module-inline
