name: Apply Dedicated Work Photo Forwarder

on:
  push:
    branches:
      - fix/dedicated-work-photo-forwarder
    paths:
      - .github/workflows/apply-dedicated-work-photo-forwarder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedicated-work-photo-forwarder
          fetch-depth: 0
      - name: Apply runtime patch and regression test
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_work_photo_patch.py
          python3 /tmp/apply_work_photo_patch.py
          node --check TarsReportApp.js
          node tests/dedicated-work-photo-forwarder.test.js
          for test_file in tests/*.test.js; do node "$test_file"; done

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/dedicated-work-photo-forwarder.test.js
          git commit -m 'fix: add dedicated work-photo forwarding decision'
          git rm .github/workflows/apply-dedicated-work-photo-forwarder.yml
          git commit -m 'ci: remove one-shot work-photo patch workflow'
          git push origin HEAD:fix/dedicated-work-photo-forwarder
