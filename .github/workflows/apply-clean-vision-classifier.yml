name: Apply Clean Vision Classifier
on:
  push:
    branches: [fix/clean-vision-classifier]
    paths:
      - .github/workflows/apply-clean-vision-classifier.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clean-vision-classifier
          fetch-depth: 0
      - name: Apply exact classifier replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TarsReportApp.js')
          s = p.read_text()

          cstart = s.index('async function personalImageKindForPreUpload')
          cend = s.index('async function personalImageIsReceiptForPreUpload', cstart)
          block = s[cstart:cend]
          old = '''      if (ocrMailing) return "mailing";\n      if (aiMailing) return "mailing";\n      if (aiReceipt) return "receipt";\n      if (ocrReceipt) return "receipt";\n      if (aiPhoto) return "photo";\n      return void 0;'''
          new = '''      if (aiMailing) return "mailing";\n      if (aiReceipt) return "receipt";\n      if (aiPhoto) return "photo";\n      if (ocrMailing) return "mailing";\n      if (ocrReceipt) return "receipt";\n      return "unknown";'''
          assert block.count(old) == 1, f'classifier guard expected once, got {block.count(old)}'
          block = block.replace(old, new, 1)
          s = s[:cstart] + block + s[cend:]

          pstart = s.index('async function protectedRoomForPersonalFile')
          pend = s.index('\n    async function ', pstart + 10)
          pblock = s[pstart:pend]
          old2 = '''      if (kind === "photo") return PROTECTED_ROOMS.otchet;\n      if (await isBlockedPersonalPhotoImage(file, content, http, config, logger)) {\n        if (logger) logger.info(`Personal upload classified as receipt by image content: room=${message.room && message.room.id || "unknown"} file=${file && (file.name || file.id) || "unknown"}`);\n        return PROTECTED_ROOMS.kassa;\n      }\n      // Default: anything not confidently a receipt or mailing proof is treated\n      // as a report work photo and goes to Otchet, rather than staying stuck\n      // in the personal chat when classification is uncertain.\n      if (logger) logger.info(`Personal upload not confirmed as receipt/mailing; defaulting to report photo: room=${message.room && message.room.id || "unknown"} file=${file && (file.name || file.id) || "unknown"}`);\n      return PROTECTED_ROOMS.otchet;'''
          new2 = '''      if (kind === "photo") return PROTECTED_ROOMS.otchet;\n      if (kind === "unknown") {\n        if (logger) logger.info(`Personal upload classification unknown; keeping in personal chat for control: room=${message.room && message.room.id || "unknown"} file=${file && (file.name || file.id) || "unknown"}`);\n        return void 0;\n      }\n      return void 0;'''
          assert pblock.count(old2) == 1, f'legacy routing guard expected once, got {pblock.count(old2)}'
          pblock = pblock.replace(old2, new2, 1)
          s = s[:pstart] + pblock + s[pend:]
          p.write_text(s)
          PY
      - name: Verify syntax and regression suite
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit runtime and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-clean-vision-classifier.yml
          git add TarsReportApp.js tests/clean-vision-classifier.test.js
          git commit -m 'fix: replace personal image routing with clean Vision classifier'
          git push origin HEAD:fix/clean-vision-classifier
