name: Apply Work Photo Route V2

on:
  push:
    branches:
      - fix/work-photo-route-v2
    paths:
      - .github/workflows/apply-work-photo-route-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-photo-route-v2
          fetch-depth: 0
      - name: Add dedicated work-photo Vision fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TarsReportApp.js')
          s = p.read_text(encoding='utf-8')
          old = '''    async function shouldForwardConfirmedWorkPhoto(file, content, http, config, logger) {
      const finalKind = await personalImageKindForPreUpload(file, content, http, config, logger);
      if (finalKind === "photo") return { forward: true, reason: "classifier" };
      if (finalKind === "receipt") return { forward: false, reason: "receipt" };
      if (finalKind === "mailing") return { forward: false, reason: "mailing" };
      return { forward: false, reason: finalKind || "unknown" };
    }
'''
          new = '''    async function requestOpenAiWorkPhotoCheck(file, content, http, config, logger) {
      if (!config || !config.openaiApiKey || !content || !content.length || !http) return false;
      const model = String(config.openaiReceiptModel || "gpt-4.1-mini").trim() || "gpt-4.1-mini";
      const imageUrl = `data:${receiptImageMimeType(file)};base64,${bytesToBase64(content)}`;
      try {
        const response = await http.post("https://api.openai.com/v1/responses", {
          headers: {
            Authorization: "Bearer " + config.openaiApiKey,
            "Content-Type": "application/json"
          },
          data: {
            model,
            input: [{
              role: "user",
              content: [
                {
                  type: "input_text",
                  text: "Определи только одно: является ли изображение фото выполненной работы салона. Фото работы = стрижка, укладка, окрашивание, волосы крупным планом, маникюр/ногти, педикюр/стопы, брови или ресницы. Банковские чеки, квитанции, экраны банков, QR/СБП, скриншоты переписки/рассылки, интерфейс Rocket.Chat, интерьер салона, товары и любые другие изображения не являются фото работы. Верни только JSON без Markdown: {\"is_work_photo\":true|false,\"kind\":\"hair|nails|pedicure|brows_lashes|other\"}."
                },
                { type: "input_image", image_url: imageUrl }
              ]
            }],
            max_output_tokens: 120
          },
          timeout: 2e4
        });
        if (!response || response.statusCode < 200 || response.statusCode >= 300) return false;
        const payload = response.data || response.content || response;
        const text = openAiReceiptOutputText(payload);
        const match = String(text || "").match(/\{[\s\S]*\}/);
        if (!match) return false;
        const parsed = JSON.parse(match[0]);
        return parsed && parsed.is_work_photo === true;
      } catch (error) {
        if (logger) logger.warn(`Dedicated work-photo Vision failed: ${error && error.message || error}`);
        return false;
      }
    }
    async function shouldForwardConfirmedWorkPhoto(file, content, http, config, logger) {
      const finalKind = await personalImageKindForPreUpload(file, content, http, config, logger);
      if (finalKind === "photo") return { forward: true, reason: "classifier" };
      if (finalKind === "receipt") return { forward: false, reason: "receipt" };
      if (finalKind === "mailing") return { forward: false, reason: "mailing" };
      if (finalKind === "unknown" || !finalKind) {
        const dedicatedWorkPhoto = await requestOpenAiWorkPhotoCheck(file, content, http, config, logger);
        if (dedicatedWorkPhoto) return { forward: true, reason: "dedicated-work-photo-vision" };
      }
      return { forward: false, reason: finalKind || "unknown" };
    }
'''
          if old not in s:
              raise SystemExit('expected work-photo decision block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          test = Path('tests/work-photo-route-v2.test.js')
          test.write_text(r'''const fs = require('fs');
const assert = require('assert');
const source = fs.readFileSync('TarsReportApp.js', 'utf8');
const a = source.indexOf('async function requestOpenAiWorkPhotoCheck');
const b = source.indexOf('async function fastForwardPersonalReportPhotos', a);
assert(a >= 0 && b > a, 'dedicated work-photo Vision helper must exist');
const block = source.slice(a, b);
assert(block.includes('is_work_photo'), 'dedicated classifier must return an explicit work-photo boolean');
assert(block.includes('finalKind === "receipt"'), 'receipt must be blocked before dedicated work-photo fallback');
assert(block.includes('finalKind === "mailing"'), 'mailing proof must be blocked before dedicated work-photo fallback');
assert(block.includes('finalKind === "unknown" || !finalKind'), 'dedicated Vision fallback must run only for unknown classification');
assert(block.includes('dedicated-work-photo-vision'), 'confirmed fallback result must be forwardable');
assert(!block.includes('FAST_PHOTO_FORWARD_DEFAULT_TO_PHOTO'), 'unknown must never default to photo without Vision confirmation');
console.log('PASS: work-photo route v2 uses guarded dedicated Vision fallback');
''', encoding='utf-8')
          PY
          node --check TarsReportApp.js
          for test_file in tests/*.test.js; do node "$test_file"; done

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/work-photo-route-v2.test.js
          git commit -m 'fix: add guarded dedicated work-photo Vision fallback'
          git rm .github/workflows/apply-work-photo-route-v2.yml
          git commit -m 'ci: remove one-shot work-photo route workflow'
          git push origin HEAD:fix/work-photo-route-v2
