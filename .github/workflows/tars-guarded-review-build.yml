name: TARS Guarded Review Build

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: tars-guarded-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax check
        run: node --check TarsReportApp.js
      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done

  claude-review:
    name: Claude ECONOMY REVIEW
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Claude credential exists
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo 'Claude review blocked: CLAUDE_CODE_OAUTH_TOKEN missing'; exit 1; }
      - name: Review PR diff
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            TARS ECONOMY REVIEW. Read CLAUDE.md first. Review ONLY this PR diff against develop and only minimal surrounding context. Do not edit, write, commit, push, deploy, or create files. Baseline 0.9.344 behavior is protected. Check regressions in receipts, duplicate protection, OCR, reports, photos, calculations, and Rocket.Chat. For receipt-date changes require one Europe/Astrakhan calendar-date semantic across acceptance, index, duplicate identity, sums, summaries, /cheki, /prinyat, repair and archive, while report/workday behavior remains unchanged. Your final line MUST be exactly FINAL_VERDICT: PASS if there is no blocking regression, or FINAL_VERDICT: BLOCK if there is one. Put any concise reason before that final line.
          claude_args: >-
            --max-turns 8
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git status:*)"
          display_report: 'false'
          show_full_output: 'false'
      - name: Enforce Claude verdict
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(os.environ.get('CLAUDE_EXECUTION_FILE',''))
          if not path.is_file():
              raise SystemExit('Claude review output file missing')
          text = path.read_text(encoding='utf-8', errors='replace')
          verdicts = re.findall(r'FINAL_VERDICT:\s*(PASS|BLOCK)\b', text)
          if not verdicts:
              raise SystemExit('Claude review returned no FINAL_VERDICT')
          verdict = verdicts[-1]
          print('Claude verdict:', verdict)
          if verdict != 'PASS':
              sys.exit(1)
          PY

  build:
    name: Build reviewed ZIP
    needs: [tests, claude-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          ZIP_NAME="tars-report_${VERSION}_${SHORT_SHA}.zip"
          zip -q -j "$ZIP_NAME" app.json TarsReportApp.js en.json ru.json icon.png
          unzip -t "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-tars-zip-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
