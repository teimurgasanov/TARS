name: TARS Guarded Review Build

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: tars-guarded-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix pas/authority
      - name: Install required shell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version
      - name: Syntax check
        run: node --check TarsReportApp.js
      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done

  claude-review:
    name: Claude ECONOMY REVIEW
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify Claude credential exists
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo 'Claude review blocked: ANTHROPIC_API_KEY missing'; exit 1; }
      - name: Review PR diff
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Immutable review identity: checked-out merge candidate ${{ github.sha }}, PR head ${{ github.event.pull_request.head.sha }}, PR base ${{ github.event.pull_request.base.sha }}. Review git diff between those exact base/head commits; do not substitute current branch tips. The canonical artifact will be built from that exact merge candidate after your PASS.
            TARS ECONOMY REVIEW. Read CLAUDE.md first. Review ONLY this PR diff against develop and only minimal surrounding context. Do not edit, write, commit, push, deploy, or create files. Baseline 0.9.344 behavior is protected. Check regressions in receipts, duplicate protection, OCR, reports, photos, calculations, and Rocket.Chat. For receipt-date changes require one Europe/Astrakhan calendar-date semantic across acceptance, index, duplicate identity, sums, summaries, /cheki, /prinyat, repair and archive, while report/workday behavior remains unchanged. Your final line MUST be exactly FINAL_VERDICT: PASS if there is no blocking regression, or FINAL_VERDICT: BLOCK if there is one. Put any concise reason before that final line.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 32
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git status:*)"
          display_report: 'false'
          show_full_output: 'false'
      - name: Enforce Claude verdict
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(os.environ.get('CLAUDE_EXECUTION_FILE',''))
          if not path.is_file():
              raise SystemExit('Claude review output file missing')
          text = path.read_text(encoding='utf-8', errors='replace')
          verdicts = re.findall(r'FINAL_VERDICT:\s*(PASS|BLOCK)\b', text)
          if not verdicts:
              raise SystemExit('Claude review returned no FINAL_VERDICT')
          verdict = verdicts[-1]
          print('Claude verdict:', verdict)
          if verdict != 'PASS':
              sys.exit(1)
          PY

  build:
    name: Build reviewed canonical ZIP
    needs: [tests, claude-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install canonical build dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          test "$(node -p 'process.versions.node.split(".")[0]')" = "20"
          test "$(node -p 'require("esbuild/package.json").version')" = "0.12.29"
      - name: Build and verify reviewed canonical package
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          ./build-tars.sh
          VERSION="$(node -p 'require("./app.json").version')"
          ZIP_PATH="$PWD/tars-report_${VERSION}.zip"
          node tools/tars-canonical-manifest.js "$ZIP_PATH" "$RUNNER_TEMP/reviewed-provenance.json"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          mkdir "$RUNNER_TEMP/reviewed-artifact"
          cp "$ZIP_PATH" "$RUNNER_TEMP/reviewed-provenance.json" "$RUNNER_TEMP/reviewed-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-tars-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-artifact/
          if-no-files-found: error
          retention-days: 14
