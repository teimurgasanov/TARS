name: TARS Guarded Review Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-develop-pipeline:
    name: Manual guarded review of develop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 2
      - name: Syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done
      - name: Verify Claude credential exists
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'Claude review blocked: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Claude ECONOMY REVIEW
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            TARS ECONOMY REVIEW. Read CLAUDE.md. Review ONLY HEAD against HEAD^ with minimal context. Do not modify anything. Baseline 0.9.344 is protected. Check receipts, duplicates, OCR, reports, photos, calculations, Rocket.Chat, and receipt-date semantics. PASS only if there is no blocking regression; otherwise BLOCK.
          claude_args: >-
            --max-turns 8
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git status:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","BLOCK"]},"summary":{"type":"string"}},"required":["verdict","summary"],"additionalProperties":false}'
          display_report: 'false'
          show_full_output: 'false'
      - name: Enforce verdict and build ZIP
        shell: bash
        env:
          CLAUDE_RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          result=json.loads(os.environ.get('CLAUDE_RESULT','') or '{}')
          print('Claude verdict:', result.get('verdict'))
          print(result.get('summary',''))
          if result.get('verdict') != 'PASS': sys.exit(1)
          PY
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          ZIP_NAME="tars-report_${VERSION}_${SHORT_SHA}.zip"
          zip -q -j "$ZIP_NAME" app.json TarsReportApp.js en.json ru.json icon.png
          unzip -t "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-tars-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
