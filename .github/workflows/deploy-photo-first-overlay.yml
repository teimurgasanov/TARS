name: Deploy TARS Photo-First Overlay

on:
  push:
    branches: [develop]
    paths:
      - PhotoFirstTarsReportApp.js
      - tests/photo-first-wrapper.test.js
      - .github/workflows/deploy-photo-first-overlay.yml

permissions:
  contents: read
  actions: read

jobs:
  deploy-photo-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed develop head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)" || { echo 'Not current develop HEAD'; exit 1; }
          node --check TarsReportApp.js
          node --check PhotoFirstTarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done

      - name: Wait for normal TARS deploy for same commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20")
            STATE=$(python3 - <<'PY' "$JSON"
          import json,sys
          data=json.loads(sys.argv[1])
          runs=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Deploy TARS to Rocket.Chat']
          if not runs:
              print('missing')
          else:
              r=runs[0]
              if r.get('status')!='completed': print('running')
              else: print(r.get('conclusion') or 'unknown')
          PY
            )
            echo "Base deploy state: $STATE"
            if [ "$STATE" = "success" ]; then break; fi
            if [ "$STATE" != "missing" ] && [ "$STATE" != "running" ]; then echo 'Base deploy failed; overlay blocked'; exit 1; fi
            sleep 10
          done
          test "$STATE" = "success" || { echo 'Timed out waiting for base deploy'; exit 1; }

      - name: Build overlay private-app ZIP
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/photo-first-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp TarsReportApp.js "$STAGE/LegacyTarsReportApp.js"
          cp PhotoFirstTarsReportApp.js "$STAGE/TarsReportApp.js"
          cp en.json ru.json icon.png "$STAGE/"
          python3 - <<'PY'
          import json, pathlib
          app=json.load(open('app.json',encoding='utf-8'))
          app['version']='0.9.349'
          app['classFile']='TarsReportApp.js'
          pathlib.Path('/tmp/photo-first-stage/app.json').write_text(json.dumps(app,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          ZIP_PATH="$RUNNER_TEMP/tars-report_0.9.349-photo-first.zip"
          (cd "$STAGE" && zip -q "$ZIP_PATH" app.json TarsReportApp.js LegacyTarsReportApp.js en.json ru.json icon.png)
          unzip -t "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Authenticate to Rocket.Chat
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          LOGIN_JSON=$(curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data "$(python3 - <<'PY'
          import json,os
          print(json.dumps({'user':os.environ['ROCKETCHAT_USER'],'password':os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" "$ROCKETCHAT_URL/api/v1/login")
          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          test -n "$AUTH_TOKEN" && test -n "$USER_ID"
          echo "AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"

      - name: Install photo-first overlay
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
        run: |
          set -euo pipefail
          PERMISSIONS_JSON=$(python3 -c 'import json; print(json.dumps(json.load(open("app.json"))["permissions"],separators=(",",":")))')
          HTTP_CODE=$(curl --silent --show-error --output /tmp/photo-first-response.out --write-out '%{http_code}' -X POST -H "X-Auth-Token: $AUTH_TOKEN" -H "X-User-Id: $USER_ID" -H 'Accept: application/json' -F "app=@${ZIP_PATH};type=application/zip" -F "permissions=${PERMISSIONS_JSON}" "$ROCKETCHAT_URL/api/apps/update")
          echo "POST /api/apps/update -> HTTP $HTTP_CODE"
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 300
          python3 - <<'PY'
          import json
          raw=open('/tmp/photo-first-response.out','rb').read()
          try: data=json.loads(raw.decode('utf-8'))
          except Exception: data={}
          app=data.get('app',data) if isinstance(data,dict) else {}
          print('Installed version:', app.get('version') if isinstance(app,dict) else None)
          PY
