name: Validate TARS and manually deploy to Rocket.Chat

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      action:
        description: "Choose guarded production action"
        required: true
        type: choice
        options:
          - DEPLOY
          - SESSION_CLEANUP
      commit_sha:
        description: "Exact reviewed develop commit SHA (required for DEPLOY only)"
        required: false
        type: string
      confirm:
        description: "Type DEPLOY for deployment or CLEANUP for session cleanup"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tars-rocketchat-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical package and optionally deploy
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve reviewed target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.action }}" != "DEPLOY" ]; then
              echo "Deployment blocked: action must be exactly DEPLOY."
              exit 1
            fi
            if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
              echo "Deployment blocked: confirmation must be exactly DEPLOY."
              exit 1
            fi
            TARGET_SHA="${{ inputs.commit_sha }}"
            [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "Deployment blocked: commit_sha must be a full 40-character SHA."
              exit 1
            }
            SOURCE="manual"
          else
            TARGET_SHA="${{ github.sha }}"
            SOURCE="develop-push-validation-only"
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install required shell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version

      - name: Install pinned build dependency
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          NODE_VERSION="$(node --version)"
          ESBUILD_VERSION="$(node -p 'require("esbuild/package.json").version')"
          test "${NODE_VERSION%%.*}" = "v20"
          test "$ESBUILD_VERSION" = "0.12.29"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "ESBUILD_VERSION=$ESBUILD_VERSION" >> "$GITHUB_ENV"

      - name: Verify exact develop commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop main --no-tags
          TARGET_SHA="$(git rev-parse HEAD)"
          REQUESTED_SHA="$(git rev-parse '${{ steps.target.outputs.sha }}^{commit}')"
          test "$TARGET_SHA" = "$REQUESTED_SHA" || {
            echo "Deployment blocked: checked-out SHA does not match requested SHA."
            exit 1
          }
          if [ "$TARGET_SHA" != "468c44b987b6808134829cd104d064bb00394943" ]; then
            git merge-base --is-ancestor "$TARGET_SHA" origin/develop || {
              echo "Deployment blocked: target is not a commit of develop."
              exit 1
            }
          else
            echo "Approved one-time report reminder deployment target verified: $TARGET_SHA"
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$TARGET_SHA" != "$(git rev-parse origin/develop)" ]; then
            echo "Validation blocked: push commit is no longer current develop HEAD."
            exit 1
          fi
          echo "Develop commit verified: $TARGET_SHA"

      - name: Verify repository and manifest safety
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git show origin/main:app.json > /tmp/stable-app.json
          python3 - <<'PY'
          import json
          with open('app.json', encoding='utf-8') as f:
              app = json.load(f)
          with open('/tmp/stable-app.json', encoding='utf-8') as f:
              stable = json.load(f)
          required = ['id', 'version', 'nameSlug', 'classFile', 'permissions']
          missing = [key for key in required if not app.get(key)]
          if missing:
              raise SystemExit(f'app.json missing required fields: {missing}')
          if app['classFile'] != 'TarsReportApp.js':
              raise SystemExit('Unexpected classFile; deployment blocked')
          for key in ('id', 'nameSlug', 'classFile'):
              if app.get(key) != stable.get(key):
                  raise SystemExit(f'{key} differs from stable main; deployment blocked')
          if app.get('permissions') != stable.get('permissions'):
              raise SystemExit('App permissions differ from stable main; deployment blocked')
          print(f"App: {app['nameSlug']} version {app['version']} id {app['id']}")
          print(f"Permissions unchanged from stable main: {len(app['permissions'])}")
          PY

      - name: Validate scripts and working tree
        shell: bash
        run: |
          set -euo pipefail
          zsh -n build-tars.sh
          node --check tools/tars-build-entry.js
          node --check tools/verify-tars-bundle.js
          node --check tests/scanner2-packaging.test.js
          node --check tests/scanner2-safe-deploy-workflow.test.js
          node --check tests/scanner2-deploy-token-hygiene.test.js
          node --check tests/receipt-vision-engine-v1.test.js
          node --check tests/receipt-extraction-fixes-v1.test.js
          node --check tests/receipt-replay-v1.test.js
          node --check tests/receipt-verification-v2-shadow.test.js
          git diff --check

      - name: Run all Scanner 2.0 tests
        shell: bash
        run: |
          set -euo pipefail
          scanner_count=0
          for test_file in tests/scanner2-*.test.js; do
            echo "==> $test_file"
            node "$test_file"
            scanner_count=$((scanner_count + 1))
          done
          test "$scanner_count" -eq 22
          echo "SCANNER2_TEST_COUNT=$scanner_count" >> "$GITHUB_ENV"

      - name: Run ImageClassificationV1 tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/image-classification-v1.test.js
          node tests/image-classification-v1-runtime-shadow.test.js
          echo "IMAGE_CLASSIFICATION_V1_TEST_COUNT=2" >> "$GITHUB_ENV"

      - name: Run Yandex AI Studio provider tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/yandex-ai-studio-vision-provider.test.js

      - name: Run Receipt Vision Engine V1 tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/receipt-vision-engine-v1.test.js
          node tests/receipt-extraction-fixes-v1.test.js
          node tests/receipt-replay-v1.test.js
          node tests/receipt-verification-v2-shadow.test.js
          echo "RECEIPT_VISION_ENGINE_V1_TEST_COUNT=4" >> "$GITHUB_ENV"

      - name: Run 77 legacy TARS tests
        shell: bash
        run: |
          set -euo pipefail
          legacy_count=0
          while IFS= read -r test_file; do
            echo "==> $test_file"
            node "$test_file"
            legacy_count=$((legacy_count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'scanner2-*.test.js' ! -name 'image-classification-v1.test.js' ! -name 'image-classification-v1-runtime-shadow.test.js' ! -name 'yandex-ai-studio-vision-provider.test.js' ! -name 'receipt-vision-engine-v1.test.js' ! -name 'receipt-extraction-fixes-v1.test.js' ! -name 'receipt-replay-v1.test.js' ! -name 'receipt-verification-v2-shadow.test.js' | sort)
          test "$legacy_count" -eq 77
          echo "LEGACY_TEST_COUNT=$legacy_count" >> "$GITHUB_ENV"

      - name: Capture protected source hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA_BEFORE=$(sha256sum TarsReportApp.js | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MANIFEST_SHA_BEFORE=$(sha256sum app.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build canonical single-file package
        shell: bash
        run: |
          set -euo pipefail
          ./build-tars.sh

      - name: Verify canonical package gate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./app.json").version')"
          ZIP_PATH="$PWD/tars-report_${VERSION}.zip"
          test -f "$ZIP_PATH"
          unzip -t "$ZIP_PATH"

          EXPECTED_CONTENTS="$(printf '%s\n' app.json TarsReportApp.js en.json ru.json icon.png)"
          ZIP_CONTENTS="$(unzip -Z1 "$ZIP_PATH")"
          test "$ZIP_CONTENTS" = "$EXPECTED_CONTENTS"

          BUNDLE_PATH="$RUNNER_TEMP/TarsReportApp.js"
          unzip -p "$ZIP_PATH" TarsReportApp.js > "$BUNDLE_PATH"
          node --check "$BUNDLE_PATH"
          node tools/verify-tars-bundle.js "$BUNDLE_PATH"

          grep -Fq 'scanner2-shadow-recorder-v1' "$BUNDLE_PATH"
          grep -Fq 'WRITE_TIMEOUT' "$BUNDLE_PATH"
          grep -Fq 'scanner2-shadow:v1:' "$BUNDLE_PATH"
          if grep -Eq '(evaluateRules|resolveConflicts|makeDecision|runOfflineComparison|runOfflineDataset)[[:space:]]*\(' "$BUNDLE_PATH"; then
            echo "Runtime Scanner 2.0 decision call detected in production bundle."
            exit 1
          fi

          test "$(sha256sum TarsReportApp.js | awk '{print $1}')" = "$SOURCE_SHA_BEFORE"
          test "$(sha256sum app.json | awk '{print $1}')" = "$MANIFEST_SHA_BEFORE"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "BUNDLE_SHA256=$(sha256sum "$BUNDLE_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          {
            echo "ZIP_CONTENTS<<EOF"
            printf '%s\n' "$ZIP_CONTENTS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upload canonical validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: tars-canonical-package-${{ steps.target.outputs.sha }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 2

      - name: Validation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## TARS canonical package validation"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Source: \`${{ steps.target.outputs.source }}\`"
            echo "- Node.js: \`$NODE_VERSION\`"
            echo "- esbuild: \`$ESBUILD_VERSION\`"
            echo "- Scanner 2.0 tests: $SCANNER2_TEST_COUNT"
            echo "- Legacy tests: $LEGACY_TEST_COUNT"
            echo "- Bundle SHA-256: \`$BUNDLE_SHA256\`"
            echo "- ZIP SHA-256: \`$ZIP_SHA256\`"
            echo
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Validation-only develop push completed. No Rocket.Chat deployment was attempted."
            else
              echo "Manual deployment gate passed; guarded deployment steps may continue."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Rocket.Chat deployment secrets
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'DEPLOY' && inputs.confirm == 'DEPLOY'
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROCKETCHAT_URL" || { echo "ROCKETCHAT_URL is missing"; exit 1; }
          test -n "$ROCKETCHAT_USER" || { echo "ROCKETCHAT_USER is missing"; exit 1; }
          test -n "$ROCKETCHAT_PASSWORD" || { echo "ROCKETCHAT_PASSWORD is missing"; exit 1; }
          case "$ROCKETCHAT_URL" in
            https://*) ;;
            *) echo "Deployment blocked: ROCKETCHAT_URL must use https://"; exit 1 ;;
          esac

      - name: Authenticate, revoke previous sessions, update app, and logout
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'DEPLOY' && inputs.confirm == 'DEPLOY'
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH_TOKEN=""
          USER_ID=""
          SESSION_OPEN=0
          UPDATE_RESPONSE="$(mktemp "$RUNNER_TEMP/tars-update-response.XXXXXX")"
          REVOKE_RESPONSE="$(mktemp "$RUNNER_TEMP/tars-revoke-response.XXXXXX")"
          LOGOUT_RESPONSE="$(mktemp "$RUNNER_TEMP/tars-logout-response.XXXXXX")"

          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            cleanup_failed=0
            if [ "$SESSION_OPEN" -eq 1 ] && [ -n "$AUTH_TOKEN" ] && [ -n "$USER_ID" ]; then
              LOGOUT_HTTP_CODE=$(curl --silent --show-error \
                --output "$LOGOUT_RESPONSE" \
                --write-out '%{http_code}' \
                -X POST \
                -H "X-Auth-Token: $AUTH_TOKEN" \
                -H "X-User-Id: $USER_ID" \
                "$ROCKETCHAT_URL/api/v1/logout")
              logout_curl_status=$?
              if [ "$logout_curl_status" -ne 0 ] || [ "$LOGOUT_HTTP_CODE" -lt 200 ] || [ "$LOGOUT_HTTP_CODE" -ge 300 ]; then
                echo "Rocket.Chat logout cleanup failed; deployment session may still be active."
                cleanup_failed=1
              else
                echo "Rocket.Chat deployment session logout: OK"
              fi
            fi
            AUTH_TOKEN=""
            USER_ID=""
            rm -f "$UPDATE_RESPONSE" "$REVOKE_RESPONSE" "$LOGOUT_RESPONSE"
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            if [ "$cleanup_failed" -ne 0 ]; then
              exit 1
            fi
            exit 0
          }
          trap cleanup EXIT

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")
          AUTH_TOKEN=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          LOGIN_JSON=""
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without authToken; deployment blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without userId; deployment blocked'; exit 1; }
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$USER_ID"
          SESSION_OPEN=1
          echo 'Rocket.Chat authentication: OK'

          REVOKE_HTTP_CODE=$(curl --silent --show-error \
            --output "$REVOKE_RESPONSE" \
            --write-out '%{http_code}' \
            -X POST \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -H "X-User-Id: $USER_ID" \
            "$ROCKETCHAT_URL/api/v1/users.logoutOtherClients")
          if [ "$REVOKE_HTTP_CODE" -lt 200 ] || [ "$REVOKE_HTTP_CODE" -ge 300 ]; then
            echo "Deployment blocked before apps/update: Rocket.Chat could not revoke previous deployment-user sessions (HTTP $REVOKE_HTTP_CODE)."
            exit 1
          fi
          echo "Rocket.Chat previous deployment-user sessions revoked: OK"

          PERMISSIONS_JSON=$(python3 - <<'PY'
          import json
          app=json.load(open('app.json', encoding='utf-8'))
          print(json.dumps(app['permissions'], separators=(',', ':')))
          PY
          )
          HTTP_CODE=$(curl --silent --show-error \
            --output "$UPDATE_RESPONSE" \
            --write-out '%{http_code}' \
            -X POST \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -H "X-User-Id: $USER_ID" \
            -H 'Accept: application/json' \
            -F "app=@${ZIP_PATH};type=application/zip" \
            -F "permissions=${PERMISSIONS_JSON}" \
            "$ROCKETCHAT_URL/api/apps/update")
          echo "POST /api/apps/update -> HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo 'Rocket.Chat rejected the private-app update. No retry will be attempted.'
            exit 1
          fi
          UPDATE_RESPONSE="$UPDATE_RESPONSE" python3 - <<'PY'
          import json
          import os
          raw=open(os.environ['UPDATE_RESPONSE'],'rb').read()
          if not raw:
              print('Rocket.Chat returned success with an empty response body.')
          else:
              try:
                  data=json.loads(raw.decode('utf-8'))
              except Exception:
                  print('Rocket.Chat returned success with a non-JSON body.')
              else:
                  app=data.get('app', data) if isinstance(data, dict) else {}
                  if isinstance(app, dict):
                      print('Installed app id:', app.get('id'))
                      print('Installed version:', app.get('version'))
                      print('Installed status:', app.get('status'))
          PY

      - name: Manual deployment summary
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'DEPLOY' && inputs.confirm == 'DEPLOY' && success()
        shell: bash
        run: |
          echo "Rocket.Chat private-app update completed."
          echo "Commit: $(git rev-parse HEAD)"
          echo "Source: ${{ steps.target.outputs.source }}"
          python3 -c 'import json; print("Version:", json.load(open("app.json"))["version"])'
          echo "Bundle SHA-256: $BUNDLE_SHA256"
          echo "ZIP SHA-256: $ZIP_SHA256"

  session_cleanup:
    name: Revoke Rocket.Chat deployment-user sessions without deploy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'SESSION_CLEANUP'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate guarded session cleanup request
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "CLEANUP" || {
            echo "Session cleanup blocked: confirmation must be exactly CLEANUP."
            exit 1
          }
          test -n "$ROCKETCHAT_URL" || { echo "ROCKETCHAT_URL is missing"; exit 1; }
          test -n "$ROCKETCHAT_USER" || { echo "ROCKETCHAT_USER is missing"; exit 1; }
          test -n "$ROCKETCHAT_PASSWORD" || { echo "ROCKETCHAT_PASSWORD is missing"; exit 1; }
          case "$ROCKETCHAT_URL" in
            https://*) ;;
            *) echo "Session cleanup blocked: ROCKETCHAT_URL must use https://"; exit 1 ;;
          esac

      - name: Revoke previous sessions and logout cleanup session
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH_TOKEN=""
          USER_ID=""
          SESSION_OPEN=0
          REVOKE_RESPONSE="$(mktemp "$RUNNER_TEMP/tars-session-cleanup-revoke.XXXXXX")"
          LOGOUT_RESPONSE="$(mktemp "$RUNNER_TEMP/tars-session-cleanup-logout.XXXXXX")"

          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            cleanup_failed=0
            if [ "$SESSION_OPEN" -eq 1 ] && [ -n "$AUTH_TOKEN" ] && [ -n "$USER_ID" ]; then
              LOGOUT_HTTP_CODE=$(curl --silent --show-error \
                --output "$LOGOUT_RESPONSE" \
                --write-out '%{http_code}' \
                -X POST \
                -H "X-Auth-Token: $AUTH_TOKEN" \
                -H "X-User-Id: $USER_ID" \
                "$ROCKETCHAT_URL/api/v1/logout")
              logout_curl_status=$?
              if [ "$logout_curl_status" -ne 0 ] || [ "$LOGOUT_HTTP_CODE" -lt 200 ] || [ "$LOGOUT_HTTP_CODE" -ge 300 ]; then
                echo "Rocket.Chat cleanup-session logout failed; the fresh session may still be active."
                cleanup_failed=1
              else
                echo "Rocket.Chat cleanup-session logout: OK"
              fi
            fi
            AUTH_TOKEN=""
            USER_ID=""
            rm -f "$REVOKE_RESPONSE" "$LOGOUT_RESPONSE"
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            if [ "$cleanup_failed" -ne 0 ]; then
              exit 1
            fi
            exit 0
          }
          trap cleanup EXIT

          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")
          AUTH_TOKEN=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          LOGIN_JSON=""
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without dynamic credential; session cleanup blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without deployment-user identifier; session cleanup blocked'; exit 1; }
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$USER_ID"
          SESSION_OPEN=1
          echo "Rocket.Chat cleanup authentication: OK"

          REVOKE_HTTP_CODE=$(curl --silent --show-error \
            --output "$REVOKE_RESPONSE" \
            --write-out '%{http_code}' \
            -X POST \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -H "X-User-Id: $USER_ID" \
            "$ROCKETCHAT_URL/api/v1/users.logoutOtherClients")
          if [ "$REVOKE_HTTP_CODE" -lt 200 ] || [ "$REVOKE_HTTP_CODE" -ge 300 ]; then
            echo "Session cleanup failed: Rocket.Chat could not revoke previous deployment-user sessions (HTTP $REVOKE_HTTP_CODE)."
            exit 1
          fi
          echo "Rocket.Chat previous deployment-user sessions revoked: OK"

      - name: Session cleanup summary
        if: success()
        shell: bash
        run: |
          echo "Rocket.Chat deployment-user session cleanup completed."
          echo "No application package was built or uploaded."
