name: Deploy TARS to Rocket.Chat

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact reviewed develop commit SHA to deploy"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY to confirm installation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tars-rocketchat-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy reviewed develop commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Deployment blocked: confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop main --no-tags
          TARGET_SHA="$(git rev-parse HEAD)"
          REQUESTED_SHA="$(git rev-parse '${{ inputs.commit_sha }}^{commit}')"
          if [ "$TARGET_SHA" != "$REQUESTED_SHA" ]; then
            echo "Deployment blocked: checked-out SHA does not match requested SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/develop; then
            echo "Deployment blocked: requested commit is not contained in origin/develop."
            exit 1
          fi
          echo "Reviewed commit verified: $TARGET_SHA"

      - name: Verify repository and manifest safety
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node --check TarsReportApp.js

          git show origin/main:app.json > /tmp/stable-app.json
          python3 - <<'PY'
          import json
          with open('app.json', encoding='utf-8') as f:
              app = json.load(f)
          with open('/tmp/stable-app.json', encoding='utf-8') as f:
              stable = json.load(f)

          required = ['id', 'version', 'nameSlug', 'classFile', 'permissions']
          missing = [k for k in required if not app.get(k)]
          if missing:
              raise SystemExit(f"app.json missing required fields: {missing}")
          if app['classFile'] != 'TarsReportApp.js':
              raise SystemExit('Unexpected classFile; deployment blocked')

          for key in ('id', 'nameSlug', 'classFile'):
              if app.get(key) != stable.get(key):
                  raise SystemExit(f'{key} differs from stable main; deployment blocked')

          if app.get('permissions') != stable.get('permissions'):
              raise SystemExit('App permissions differ from stable main; deployment blocked')

          print(f"App: {app['nameSlug']} version {app['version']} id {app['id']}")
          print(f"Permissions unchanged from stable main: {len(app['permissions'])}")
          PY

      - name: Run full regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done

      - name: Build private-app ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          ZIP_PATH="$RUNNER_TEMP/tars-report_${VERSION}.zip"
          rm -f "$ZIP_PATH"
          zip -q -j "$ZIP_PATH" app.json TarsReportApp.js en.json ru.json icon.png
          unzip -t "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Built: $ZIP_PATH"
          unzip -l "$ZIP_PATH"

      - name: Validate Rocket.Chat deployment secrets
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROCKETCHAT_URL" || { echo "ROCKETCHAT_URL is missing"; exit 1; }
          test -n "$ROCKETCHAT_USER" || { echo "ROCKETCHAT_USER is missing"; exit 1; }
          test -n "$ROCKETCHAT_PASSWORD" || { echo "ROCKETCHAT_PASSWORD is missing"; exit 1; }
          case "$ROCKETCHAT_URL" in
            https://*) ;;
            *) echo "Deployment blocked: ROCKETCHAT_URL must use https://"; exit 1 ;;
          esac

      - name: Authenticate to Rocket.Chat
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
          ROCKETCHAT_USER: ${{ secrets.ROCKETCHAT_USER }}
          ROCKETCHAT_PASSWORD: ${{ secrets.ROCKETCHAT_PASSWORD }}
        run: |
          set -euo pipefail
          LOGIN_JSON=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'user': os.environ['ROCKETCHAT_USER'], 'password': os.environ['ROCKETCHAT_PASSWORD']}))
          PY
          )" \
            "$ROCKETCHAT_URL/api/v1/login")

          AUTH_TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("authToken", ""))' <<<"$LOGIN_JSON")
          USER_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("userId", ""))' <<<"$LOGIN_JSON")
          test -n "$AUTH_TOKEN" || { echo 'Login succeeded without authToken; deployment blocked'; exit 1; }
          test -n "$USER_ID" || { echo 'Login succeeded without userId; deployment blocked'; exit 1; }
          echo "AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo 'Rocket.Chat authentication: OK'

      - name: Update private app through Rocket.Chat upload API
        shell: bash
        env:
          ROCKETCHAT_URL: ${{ secrets.ROCKETCHAT_URL }}
        run: |
          set -euo pipefail
          PERMISSIONS_JSON=$(python3 - <<'PY'
          import json
          app=json.load(open('app.json', encoding='utf-8'))
          print(json.dumps(app['permissions'], separators=(',', ':')))
          PY
          )

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/deploy-response.out \
            --write-out '%{http_code}' \
            -X POST \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -H "X-User-Id: $USER_ID" \
            -H 'Accept: application/json' \
            -F "app=@${ZIP_PATH};type=application/zip" \
            -F "permissions=${PERMISSIONS_JSON}" \
            "$ROCKETCHAT_URL/api/apps/update")

          echo "POST /api/apps/update -> HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo 'Rocket.Chat rejected the private-app update. No retry will be attempted.'
            python3 - <<'PY'
          raw=open('/tmp/deploy-response.out','rb').read(2000)
          print(raw.decode('utf-8','replace'))
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          raw=open('/tmp/deploy-response.out','rb').read()
          if not raw:
              print('Rocket.Chat returned success with an empty response body.')
          else:
              try:
                  data=json.loads(raw.decode('utf-8'))
              except Exception:
                  print('Rocket.Chat returned success with a non-JSON body.')
              else:
                  app=data.get('app', data) if isinstance(data, dict) else {}
                  if isinstance(app, dict):
                      print('Installed app id:', app.get('id'))
                      print('Installed version:', app.get('version'))
                      print('Installed status:', app.get('status'))
          PY

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "Rocket.Chat private-app update completed."
          echo "Commit: $(git rev-parse HEAD)"
          python3 -c 'import json; print("Version:", json.load(open("app.json"))["version"])'
          echo "ZIP SHA-256: $ZIP_SHA256"
