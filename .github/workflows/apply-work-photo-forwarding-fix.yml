name: Apply Work Photo Forwarding Fix
on:
  push:
    branches: [fix/work-photo-forwarding]
    paths:
      - .github/workflows/apply-work-photo-forwarding-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-photo-forwarding
          fetch-depth: 0
      - name: Apply exact work-photo classifier patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text()
          old='''    function aiCandidateMarksReportPhoto(candidate) {\n      const text = String(candidate && candidate.text || "");\n      return Boolean(candidate && (\n        /"visual_type"\\s*:\\s*"(?:hair_work_photo|nails_work_photo|brows_lashes_work_photo|pedicure_work_photo|work_photo)"/i.test(text)\n      ));\n    }'''
          new='''    function aiCandidateMarksReportPhoto(candidate) {\n      const text = String(candidate && candidate.text || "");\n      const parsed = parseReceiptJson(text) || {};\n      const visualType = String(parsed.visual_type || "").trim().toLowerCase();\n      if (/^(?:hair_work_photo|nails_work_photo|brows_lashes_work_photo|pedicure_work_photo|work_photo)$/.test(visualType)) return true;\n      if (!candidate || parsed.is_receipt !== false) return false;\n      if (parsed.is_mailing_proof === true || parsed.is_screenshot_of_chat === true) return false;\n      if (/^(?:bank_receipt|bank_app_screen|receipt_on_phone|qr_payment_receipt|mailing_proof_screenshot|salon_photo|chat_screenshot)$/.test(visualType)) return false;\n      const serviceType = String(parsed.service_type || "").trim().toLowerCase();\n      return /^(?:haircut|coloring|manicure|pedicure|brows|lashes)$/.test(serviceType);\n    }'''
          assert s.count(old)==1, f'work-photo function guard expected once, got {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify syntax and full regression suite
        run: |
          set -euo pipefail
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit runtime and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-work-photo-forwarding-fix.yml
          git add TarsReportApp.js tests/work-photo-forwarding.test.js
          git commit -m 'fix: forward guarded semantic work photos to reports'
          git push origin HEAD:fix/work-photo-forwarding
