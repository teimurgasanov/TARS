name: Apply pre-index scope fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preindex-scope-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply scoped pre-upload reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js')
          s=p.read_text()

          anchor='''    async function rejectDuplicateMessage(message, read, persistence, modify, logger, http, ocrConfig) {'''
          helper='''    function preUploadEntryMatchesMessage(entry, messageFileId, message, now = Date.now()) {\n      if (!entry || entry.source !== "pre") return false;\n      const uploadId = String(messageFileId || "");\n      if (!uploadId) return false;\n      const uploadMatches = String(entry.uploadAttemptKey || "") === uploadId || String(entry.uploadId || "") === uploadId;\n      if (!uploadMatches) return false;\n      const userId = String(message && message.sender && message.sender.id || "");\n      const roomId = String(message && message.room && message.room.id || "");\n      if (!userId || !roomId) return false;\n      if (String(entry.userId || "") !== userId || String(entry.roomId || "") !== roomId) return false;\n      const uploadedAt = Number(entry.uploadedAt || 0);\n      const ttlMs = 30 * 60 * 1e3;\n      return uploadedAt > 0 && uploadedAt >= now - ttlMs && uploadedAt <= now + 60 * 1e3;\n    }\n'''
          if s.count(anchor)!=1: raise SystemExit(f'rejectDuplicateMessage anchor mismatch: {s.count(anchor)}')
          s=s.replace(anchor, helper+anchor, 1)

          old='''          let preclassifiedRoom;\n          if (personalRoom) {\n            for (const candidateRoom of [PROTECTED_ROOMS.kassa, PROTECTED_ROOMS.otchet]) {\n              const candidateIndex = await getScopedIndex(candidateRoom);\n              const preEntry = candidateIndex && candidateIndex.photos.find((entry) => entry && entry.source === "pre" && (String(entry.uploadAttemptKey || "") === messageFileId || String(entry.uploadId || "") === messageFileId));\n              if (preEntry) {\n                preclassifiedRoom = candidateRoom;\n                if (logger) logger.info(`Reused pre-upload ${candidateRoom.kind} classification for upload ${messageFileId}`);\n                break;\n              }\n            }\n          }'''
          new='''          let preclassifiedRoom;\n          if (personalRoom && intent !== "mailing") {\n            for (const candidateRoom of [PROTECTED_ROOMS.kassa, PROTECTED_ROOMS.otchet]) {\n              const candidateIndex = await getScopedIndex(candidateRoom);\n              const preEntry = candidateIndex && candidateIndex.photos.find((entry) => preUploadEntryMatchesMessage(entry, messageFileId, message));\n              if (preEntry) {\n                preclassifiedRoom = candidateRoom;\n                if (logger) logger.info(`Reused scoped pre-upload ${candidateRoom.kind} classification for upload ${messageFileId}`);\n                break;\n              }\n            }\n          }'''
          if s.count(old)!=1: raise SystemExit(f'preclassified block mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check TarsReportApp.js

      - name: Replace routing regression test with behavior checks
        shell: bash
        run: |
          cat > tests/preindex-routing.test.js <<'EOF'
          const fs = require('fs');
          const assert = require('assert');

          const source = fs.readFileSync('TarsReportApp.js', 'utf8');
          const start = source.indexOf('function preUploadEntryMatchesMessage');
          const end = source.indexOf('async function rejectDuplicateMessage', start);
          if (start < 0 || end < 0 || end <= start) throw new Error('pre-upload matcher block not found');
          eval(source.slice(start, end));

          const now = Date.now();
          const message = { sender: { id: 'user-a' }, room: { id: 'room-a' } };
          const freshReceipt = { source: 'pre', uploadAttemptKey: 'up-1', userId: 'user-a', roomId: 'room-a', uploadedAt: now - 1000 };

          assert.strictEqual(preUploadEntryMatchesMessage(freshReceipt, 'up-1', message, now), true, 'fresh same upload/user/room must be reusable');
          assert.strictEqual(preUploadEntryMatchesMessage({ ...freshReceipt, userId: 'user-b' }, 'up-1', message, now), false, 'foreign user must not reuse pre-entry');
          assert.strictEqual(preUploadEntryMatchesMessage({ ...freshReceipt, roomId: 'room-b' }, 'up-1', message, now), false, 'foreign room must not reuse pre-entry');
          assert.strictEqual(preUploadEntryMatchesMessage({ ...freshReceipt, uploadedAt: now - 31 * 60 * 1000 }, 'up-1', message, now), false, 'stale pre-entry must not be reused');
          assert.strictEqual(preUploadEntryMatchesMessage({ ...freshReceipt, uploadAttemptKey: 'other' }, 'up-1', message, now), false, 'different upload must not match');

          const intentGuard = source.indexOf('if (intent === "mailing") return false;');
          const reuseBlock = source.indexOf('let preclassifiedRoom;', intentGuard);
          assert(intentGuard >= 0 && reuseBlock > intentGuard, 'mailing must exit before pre-upload reuse');
          assert(source.slice(reuseBlock, reuseBlock + 1200).includes('intent !== "mailing"'), 'reuse block must explicitly preserve mailing priority');
          assert(source.includes('protectedRoom = preclassifiedRoom || await protectedRoomForPersonalFile'), 'fallback classification must remain');

          console.log('PASS: scoped pre-upload routing behavior');
          EOF

      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.test.js; do echo "==> $f"; node "$f"; done

      - name: Commit only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TARS Automation'
          git config user.email 'tars-automation@users.noreply.github.com'
          git add TarsReportApp.js tests/preindex-routing.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope pre-upload routing reuse to message context'
          git push origin HEAD:develop
