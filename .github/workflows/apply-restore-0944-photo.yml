name: Apply Restore 0944 Photo Forward
on:
  push:
    branches: [fix/restore-0944-photo-forward]
    paths: [.github/workflows/apply-restore-0944-photo.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-0944-photo-forward
          fetch-depth: 0
      - name: Restore stable unknown-image fallback and align regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TarsReportApp.js'); s=p.read_text(encoding='utf-8')
          old='''      if (finalKind === "unknown" || !finalKind) {\n        const dedicatedWorkPhoto = await requestOpenAiWorkPhotoCheck(file, content, http, config, logger);\n        if (dedicatedWorkPhoto) return { forward: true, reason: "dedicated-work-photo-vision" };\n      }\n      return { forward: false, reason: finalKind || "unknown" };'''
          new='''      if (finalKind === "unknown" || !finalKind) {\n        // Stable 0.9.344 behavior: receipt and mailing are already blocked;\n        // an otherwise unknown personal image continues to Reports.\n        return { forward: true, reason: "stable-0944-unknown-photo-fallback" };\n      }\n      return { forward: false, reason: finalKind || "unknown" };'''
          if old not in s: raise SystemExit('expected current work-photo decision block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('tests/restore-0944-photo-fallback.test.js').write_text('''const fs=require("fs"),assert=require("assert"); const s=fs.readFileSync("TarsReportApp.js","utf8"); const a=s.indexOf("async function shouldForwardConfirmedWorkPhoto"),b=s.indexOf("async function fastForwardPersonalReportPhotos",a); assert(a>=0&&b>a); const x=s.slice(a,b); assert(x.includes('finalKind === "receipt"')); assert(x.includes('finalKind === "mailing"')); assert(x.includes('stable-0944-unknown-photo-fallback')); console.log("PASS: stable 0.9.344 unknown-image fallback restored");\n''',encoding='utf-8')
          Path('tests/work-photo-route-v2.test.js').write_text('''const fs=require("fs"),assert=require("assert"); const s=fs.readFileSync("TarsReportApp.js","utf8"); const a=s.indexOf("async function shouldForwardConfirmedWorkPhoto"),b=s.indexOf("async function fastForwardPersonalReportPhotos",a); assert(a>=0&&b>a); const x=s.slice(a,b); assert(x.includes('finalKind === "receipt"'),"receipt remains blocked"); assert(x.includes('finalKind === "mailing"'),"mailing remains blocked"); assert(x.includes('finalKind === "photo"'),"confirmed photo remains forwardable"); assert(x.includes('stable-0944-unknown-photo-fallback'),"unknown non-receipt/non-mailing image uses stable baseline fallback"); console.log("PASS: work-photo route matches restored stable baseline");\n''',encoding='utf-8')
          PY
          node --check TarsReportApp.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarsReportApp.js tests/restore-0944-photo-fallback.test.js tests/work-photo-route-v2.test.js
          git commit -m 'fix: restore stable 0.9.344 photo fallback'
          git rm .github/workflows/apply-restore-0944-photo.yml
          git commit -m 'ci: remove one-shot restore workflow'
          git push origin HEAD:fix/restore-0944-photo-forward
